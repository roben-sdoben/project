    for(const[lbl,val]of Object.entries(trapAngles)){
      const label = val!=null ? val+'°' : '';
      if(lbl.length===3){const v=lbl[1];if(s.points[v]&&s.points[lbl[0]]&&s.points[lbl[2]])s.angleMarks.push({v:s.points[v],d1:s.points[lbl[0]],d2:s.points[lbl[2]],label});}
      else if(lbl.length===1&&s.points[lbl]){const vi=[A,B,C,D].indexOf(lbl);if(vi>=0){const prev=[A,B,C,D][(vi+3)%4],next=[A,B,C,D][(vi+1)%4];if(s.points[prev]&&s.points[next])s.angleMarks.push({v:s.points[lbl],d1:s.points[prev],d2:s.points[next],label});}}
    }
    // Углы вершин без явного значения — помечаем дугой если упомянуты
    {const angM=ctx.raw.matchAll(/угол\s+([A-Z])(?!\s*=|\s*рав)/gi);
    for(const m of angM){
      const lbl=m[1];if(s.points[lbl]&&!trapAngles[lbl]){
        const vi=[A,B,C,D].indexOf(lbl);
        if(vi>=0){const prev=[A,B,C,D][(vi+3)%4],next=[A,B,C,D][(vi+1)%4];
          if(s.points[prev]&&s.points[next])s.angleMarks.push({v:s.points[lbl],d1:s.points[prev],d2:s.points[next],label:''});
        }
      }
    }}
    // Dimensions
    for(const seg in segs){const[l1,l2]=seg.split('');if(s.points[l1]&&s.points[l2])s.dims.push({p1:s.points[l1],p2:s.points[l2],text:fmtNum(segs[seg])});}
    if(!segs[A+D]&&!segs[D+A])s.dims.push({p1:pa,p2:pd,text:fmtNum(ad)});
    if(!segs[B+C]&&!segs[C+B])s.dims.push({p1:pb,p2:pc,text:fmtNum(bc)});
    addQuadExtra(ctx,s,[A,B,C,D]);
    return s;
  }

  if(S==='parallelogram'||S==='pgram_bisectors'){
    const[A,B,C,D]=ctx.quadVerts;
    let a=10,b=7,angle=70; // a=AD=BC, b=AB=CD
    for(const seg in segs){
      if([A+D,D+A,B+C,C+B].includes(seg))a=segs[seg];
      else if([A+B,B+A,C+D,D+C].includes(seg))b=segs[seg];
    }
    for(const[l,v]of Object.entries(ctx.angles)){if(v!==90)angle=v;break;}
    const hasBis=/биссектрис/i.test(ctx.tl), hasDiag=has('diagonal');
    
    // Two bisectors meeting on side
    let twoBisV=ctx.twoBisectorVertices;
    let bisOnSide=ctx.bisOnSide||null;
    if(S==='pgram_bisectors'&&!twoBisV){twoBisV=[A,D];bisOnSide=B+C;}
    // For bisectors of A and D on BC → a = 2*b
    if(twoBisV&&bisOnSide&&!segs[A+D]&&!segs[D+A]&&!segs[B+C]&&!segs[C+B]) a=2*b;
    if(angle===70&&hasBis) angle=60;
    
    const r=d2r(angle);
    const pa=P(0,0,A),pb=P(b*cos(r),b*sin(r),B),pd=P(a,0,D),pc=P(a+b*cos(r),b*sin(r),C);
    s.lines.push([pa,pb],[pb,pc],[pc,pd],[pd,pa]);
    
    // Equal opposite sides marks
    s.equalMarks.push([[pa,pb],[pc,pd]]);  // AB = CD
    if(abs(a-b)>0.1) s.equalMarks.push([[pb,pc],[pd,pa]]); // BC = AD (2nd set of ticks)
    
    // Angle marks: show given angle + supplementary
    if(Object.keys(ctx.angles).length){
      s.angleMarks.push({v:pa,d1:pd,d2:pb,label:angle+'°'});
      // Opposite angle is equal
      s.angleMarks.push({v:pc,d1:pb,d2:pd,label:angle+'°'});
    }
    
    // Diagonals
    if(hasDiag){
      s.dashed.push([pa,pc],[pb,pd]);
      const O=lineIntersect(pa,pc,pb,pd);
      if(O){P(O.x,O.y,ctx.intersectionPt||'O');
        // Diagonals bisect each other → mark equal halves
        const pO=s.points[ctx.intersectionPt||'O'];
        if(pO)s.equalMarks.push([[pa,pO],[pO,pc]],[[pb,pO],[pO,pd]]);
      }
    }
    
    // Single bisector: "биссектриса угла A пересекает сторону BC в точке E"
    if(ctx.bisVertex){
      const vidx=[A,B,C,D].indexOf(ctx.bisVertex);
      if(vidx>=0){
        const pts4=[s.points[A],s.points[B],s.points[C],s.points[D]];
        const bd=quadBisDir(vidx,pts4,[A,B,C,D]);
        const bEnd={x:bd.vp.x+bd.x*500,y:bd.vp.y+bd.y*500};
        const side=ctx.bisHitSide||B+C;
        const sA_=s.points[side[0]],sB_=s.points[side[1]];
        if(sA_&&sB_){
          const E=lineIntersect(bd.vp,bEnd,sA_,sB_);
          if(E){P(E.x,E.y,ctx.bisHitPt||'E');s.dashed.push([bd.vp,s.points[ctx.bisHitPt||'E']]);}
        }
      }
    }
    
    // Two bisectors on side
    if(twoBisV&&bisOnSide){
      const sA_=s.points[bisOnSide[0]],sB_=s.points[bisOnSide[1]];
      if(sA_&&sB_){
        const pts4=[s.points[A],s.points[B],s.points[C],s.points[D]];
        let meetPt=null;
        for(const vl of twoBisV){
          const vidx=[A,B,C,D].indexOf(vl);if(vidx<0)continue;
          const bd=quadBisDir(vidx,pts4,[A,B,C,D]);
          const bEnd={x:bd.vp.x+bd.x*500,y:bd.vp.y+bd.y*500};
          const E=lineIntersect(bd.vp,bEnd,sA_,sB_);
          if(E){if(!meetPt)meetPt=E;s.dashed.push([bd.vp,{x:E.x,y:E.y,label:''}]);}
        }
        if(meetPt)P(meetPt.x,meetPt.y,ctx.intersectionPt||'E');
      }
    }
    
    // Dimensions
    for(const seg in segs){const[l1,l2]=seg.split('');if(s.points[l1]&&s.points[l2])s.dims.push({p1:s.points[l1],p2:s.points[l2],text:fmtNum(segs[seg])});}
    if(segs[A+B]||segs[B+A])s.dims.push({p1:pa,p2:pb,text:'AB='+fmtNum(b)});
    addQuadExtra(ctx,s,[A,B,C,D]);
    return s;
  }

  if(S==='rhombus'||S==='rhombus_diag_dist'){
    const[A,B,C,D]=ctx.quadVerts;
    let side=null,angle=null;
    for(const seg in segs)if([A+B,B+A,A+D,D+A,B+C,C+B,C+D,D+C].includes(seg)){side=segs[seg];break;}
    if(ctx.sides&&ctx.sides.a&&!side) side=ctx.sides.a;
    for(const[l,v]of Object.entries(ctx.angles)){angle=v;break;}
    const distS=ctx.diagToSideDist;
    let d1=ctx.oneDiagVal||ctx.diag1||null, d2=ctx.diag2||null;
    for(const seg in segs)if([A+C,C+A,B+D,D+B].includes(seg)){if(!d1)d1=segs[seg];else if(!d2)d2=segs[seg];}

    // Height divides side: DH=21, CH=8
    const heightDiv=ctx.heightDivides;
    
    // === Build from diag-to-side distance ===
    if(S==='rhombus_diag_dist'&&distS&&d1){
      const D2=distS,D1=d1;const x_=4*D2*D2*D1*D1/(D1*D1-4*D2*D2);d2=x_>0?sqrt(x_):20;
      const pa=P(-d1/2,0,A),pc=P(d1/2,0,C),pb=P(0,d2/2,B),pd_=P(0,-d2/2,D),pO=P(0,0,'O');
      s.lines.push([pa,pb],[pb,pc],[pc,pd_],[pd_,pa]);
      s.dashed.push([pa,pc],[pb,pd_]);
      s.equalMarks.push([[pa,pb],[pb,pc],[pc,pd_],[pd_,pa]]);
      s.rightAngles.push({v:pO,d1:pa,d2:pb});
      const fH=footPerp(pO,pa,pb);const pH=P(fH.x,fH.y,'H');
      s.dashed.push([pO,pH]);s.rightAngles.push({v:pH,d1:pO,d2:pb});
      s.dims.push({p1:pO,p2:pH,text:fmtNum(distS)},{p1:pa,p2:pc,text:'d₁='+fmtNum(d1)});
      addQuadExtra(ctx,s,[A,B,C,D]);
      return s;
    }
    // === Build from both diagonals ===
    if(d1&&d2&&!side){
      side=sqrt((d1/2)**2+(d2/2)**2);
      angle=r2d(2*atan2(d2/2,d1/2));
    }
    // === Build from height divides side ===
    if(heightDiv){
      const DH=heightDiv.dh,CH=heightDiv.ch,CD_=DH+CH;side=CD_;
      const angleD=Math.acos(min(DH/side,1));angle=180-r2d(angleD);
      const r_=d2r(angle);
      const pa=P(0,0,A),pb=P(side*cos(r_),side*sin(r_),B),pd_=P(side,0,D),pc=P(side+side*cos(r_),side*sin(r_),C);
      s.lines.push([pa,pb],[pb,pc],[pc,pd_],[pd_,pa]);
      const fH=footPerp(pa,pc,pd_);const pH=P(fH.x,fH.y,'H');
      s.dashed.push([pa,pH]);s.rightAngles.push({v:pH,d1:pa,d2:pd_});
      s.dims.push({p1:pd_,p2:pH,text:'DH='+fmtNum(DH)},{p1:pH,p2:pc,text:'CH='+fmtNum(CH)});
      s.equalMarks.push([[pa,pb],[pb,pc],[pc,pd_],[pd_,pa]]);
      addQuadExtra(ctx,s,[A,B,C,D]);
      return s;
    }
    // === Default build from side + angle ===
    if(!side)side=8;
    if(!angle)angle=60;
    const r_=d2r(angle);
    const pa=P(0,0,A),pb=P(side*cos(r_),side*sin(r_),B);
    const pc=P(side+side*cos(r_),side*sin(r_),C),pd_=P(side,0,D);
    s.lines.push([pa,pb],[pb,pc],[pc,pd_],[pd_,pa]);
    // All sides equal
    s.equalMarks.push([[pa,pb],[pb,pc],[pc,pd_],[pd_,pa]]);
    // Angle marks: A and C equal, B and D equal (supplementary)
    s.angleMarks.push({v:pa,d1:pd_,d2:pb,label:angle+'°'});
    s.angleMarks.push({v:pc,d1:pb,d2:pd_,label:angle+'°'});
    // Diagonals
    if(has('diagonal')||d1||d2){
      s.dashed.push([pa,pc],[pb,pd_]);
      const O=lineIntersect(pa,pc,pb,pd_);
      if(O){P(O.x,O.y,ctx.intersectionPt||'O');
        s.rightAngles.push({v:s.points[ctx.intersectionPt||'O'],d1:pa,d2:pb});
        // Equal halves
        const pO=s.points[ctx.intersectionPt||'O'];
        s.equalMarks.push([[pa,pO],[pO,pc]],[[pb,pO],[pO,pd_]]);
      }
    }
    for(const seg in segs){const[l1,l2]=seg.split('');if(s.points[l1]&&s.points[l2])s.dims.push({p1:s.points[l1],p2:s.points[l2],text:fmtNum(segs[seg])});}
    addQuadExtra(ctx,s,[A,B,C,D]);
    return s;
  }

  if(S==='rectangle'){
    const[A,B,C,D]=ctx.quadVerts;let w=10,h=6,diag=ctx.diag1||null;
    let perim=ctx.perimeter;
    for(const seg in segs){
      if([A+B,B+A,C+D,D+C].includes(seg))h=segs[seg];
      else if([B+C,C+B,A+D,D+A].includes(seg))w=segs[seg];
      else if([A+C,C+A,B+D,D+B].includes(seg))diag=segs[seg];
    }
    if(ctx.sides&&ctx.sides.a&&ctx.sides.b){w=max(ctx.sides.a,ctx.sides.b);h=min(ctx.sides.a,ctx.sides.b);}
    if(perim&&diag){const sP=perim/2,wh=(sP*sP-diag*diag)/2,disc=sP*sP-4*wh;if(disc>=0){w=(sP+sqrt(disc))/2;h=sP-w;}}
    if(perim&&!diag&&w===10){w=perim/2*0.6;h=perim/2-w;}
    const pa=P(0,0,A),pb=P(0,h,B),pc=P(w,h,C),pd=P(w,0,D);
    s.lines.push([pa,pb],[pb,pc],[pc,pd],[pd,pa]);
    // Right angles at all corners
    [[pa,pd,pb],[pb,pa,pc],[pc,pb,pd],[pd,pc,pa]].forEach(([v,d1_,d2_])=>s.rightAngles.push({v,d1:d1_,d2:d2_}));
    // Equal opposite sides
    s.equalMarks.push([[pa,pb],[pc,pd]]);
    s.equalMarks.push([[pb,pc],[pd,pa]]);
    // Diagonal
    if(diag||has('diagonal')){
      s.dashed.push([pa,pc]);
      if(diag)s.dims.push({p1:pa,p2:pc,text:'d='+fmtNum(diag)});
    }
    // Dimensions
    s.dims.push({p1:pa,p2:pd,text:fmtNum(w)},{p1:pa,p2:pb,text:fmtNum(h)});
    addQuadExtra(ctx,s,[A,B,C,D]);
    return s;
  }

  if(S==="square"){
    const[A,B,C,D]=ctx.quadVerts;let side=8;
    for(const seg in segs){side=segs[seg];break;}
    const pa=P(0,0,A),pb=P(0,side,B),pc=P(side,side,C),pd=P(side,0,D);
    s.lines.push([pa,pb],[pb,pc],[pc,pd],[pd,pa]);
    [[pa,pd,pb],[pb,pa,pc],[pc,pb,pd],[pd,pc,pa]].forEach(([v,d1_,d2_])=>s.rightAngles.push({v,d1:d1_,d2:d2_}));
    s.equalMarks.push([[pa,pb],[pb,pc],[pc,pd],[pd,pa]]);
    if(has('diagonal')){s.dashed.push([pa,pc],[pb,pd]);}
    addQuadExtra(ctx,s,[A,B,C,D]);
    return s;
  }


  // ===================== PERP BISECTOR =====================
  if(S==='perp_bisector'){
    let AB=10;for(const seg in segs){AB=segs[seg];break;}
    const A=P(-AB/2,0,'A'),B=P(AB/2,0,'B'),M=P(0,0,'M');
    let PM=7; if(segs.PM||segs.MP)PM=segs.PM||segs.MP;
    const Pp=P(0,PM,'P');
    s.lines.push([A,B]);
    s.dashed.push([P(0,-PM*0.3,''),Pp]);
    s.rightAngles.push({v:M,d1:B,d2:Pp});
    s.equalMarks.push([[A,M],[M,B]]);
    if(segs.PM||segs.MP)s.dims.push({p1:Pp,p2:M,text:fmtNum(PM)});
    s.dims.push({p1:A,p2:B,text:fmtNum(AB)});
    return s;
  }

  return s;
}

// ====== Add heights / medians / bisectors to a QUADRILATERAL ======
// pts4: {A,B,C,D} from s.points; labs: [A,B,C,D] labels; s: solution object
function addQuadExtra(ctx, s, labs) {
  const [A,B,C,D] = labs;
  const pts = s.points;
  const tl = ctx.tl, raw = ctx.raw;
  const P = (x,y,l) => { const p={x,y,label:l}; if(l) s.points[l]=p; return p; };
  const F = new Set(ctx.features||[]);
  const has = f => F.has(f);

  const sides = [
    [A,B],[B,C],[C,D],[D,A]
  ];

  // Helper: foot of perpendicular from point p to segment (a,b)
  function foot(p, a, b) {
    const dx=b.x-a.x, dy=b.y-a.y, len2=dx*dx+dy*dy;
    if(len2<1e-9) return {x:a.x,y:a.y};
    const t=((p.x-a.x)*dx+(p.y-a.y)*dy)/len2;
    return {x:a.x+t*dx, y:a.y+t*dy};
  }

  // --- Height in quad — буквы пользователя ---
  if(ctx.features.includes('height') || /высот/.test(tl)) {
    const hm = raw.match(/высот[а-яёa-z0-9]*\s+([A-Za-z])([A-Za-z])/i)
             || raw.match(/([A-Za-z])([A-Za-z])\s*[-—–]\s*высот/i);
    let fromL = null, footL = null;
    if(hm) {
      const c1 = hm[1].toUpperCase(), c2 = hm[2].toUpperCase();
      // Если первая буква — вершина фигуры, это "высота XY" (X=from, Y=foot)
      if(labs.includes(c1)) { fromL = c1; footL = labs.includes(c2) ? null : c2; }
      else { fromL = c1; footL = c2; }
    }
    // "из угла D" / "из вершины D"
    if(!fromL) {
      const hm2 = raw.match(/из\s+(?:угл[а-яё]*|вершины)\s+([A-Za-z])/i);
      if(hm2) fromL = hm2[1].toUpperCase();
    }
    // "проведена высота" — без явного указания откуда
    if(!fromL) {
      const hm3 = raw.match(/высот[а-яёa-z0-9]*\s+(?:угл[а-яё]*\s+)?([A-Za-z])\b/i);
      if(hm3 && labs.includes(hm3[1].toUpperCase())) fromL = hm3[1].toUpperCase();
    }
    if(!fromL) fromL = labs[2] || C; // fallback: third vertex
    // footL: если не задан явно или совпадает с вершиной, выбираем свободную букву
    if(!footL || labs.includes(footL)) {
      // Предпочитаем H, затем P, K, T, E
      for(const cand of ['H','P','K','T','E','Q']) {
        if(!labs.includes(cand) && !pts[cand]) { footL = cand; break; }
      }
    }
    const fromPt = pts[fromL];
    if(fromPt) {
      // Найти сторону, на которую опускается высота:
      // стороны, НЕ содержащие fromL, среди них — наиболее удалённая
      const candidateSides = sides.filter(([x,y]) => x!==fromL && y!==fromL);
      let bestSide = null, bestDist = -1;
      for(const [x,y] of candidateSides) {
        const a=pts[x], b=pts[y];
        if(!a||!b) continue;
        const f2 = foot(fromPt, a, b);
        const d_ = Math.hypot(fromPt.x-f2.x, fromPt.y-f2.y);
        if(d_ > bestDist) { bestDist=d_; bestSide=[x,y]; }
      }
      if(bestSide) {
        const a = pts[bestSide[0]], b = pts[bestSide[1]];
        if(a && b) {
          const f = foot(fromPt, a, b);
          const H = P(f.x, f.y, footL);
          s.dashed.push([fromPt, H]);
          s.rightAngles.push({v:H, d1:fromPt, d2:b});
        }
      }
    }
  }

  // --- Median in quad (connects midpoints of opposite sides) ---
  if(ctx.features.includes('median') || /медиан/.test(tl)) {
    // "медиана KM" / "медиана SH" — буквы пользователя
    const mm = raw.match(/медиан[а-яёa-z0-9]*\s+([A-Za-z])([A-Za-z])/i)
             || raw.match(/средн[а-яёa-z0-9]*\s+лини[а-яёa-z0-9]*\s+([A-Za-z])([A-Za-z])/i);
    let p1L = mm ? mm[1].toUpperCase() : null;
    let p2L = mm ? mm[2].toUpperCase() : null;
    if(!p1L) { p1L = 'M'; p2L = 'N'; }
    if(!pts[p1L] && !pts[p2L]) {
      const a=pts[A],b=pts[B],c=pts[C],d=pts[D];
      if(a&&b&&c&&d) {
        // Для ромба медиана = средняя линия параллельная стороне
        // Определяем, параллельно какой паре сторон проводится (AB||CD или BC||AD)
        // Средняя линия, параллельная AB и CD: середины BC и AD
        const m1 = P((b.x+c.x)/2,(b.y+c.y)/2,p1L);
        const m2 = P((a.x+d.x)/2,(a.y+d.y)/2,p2L);
        s.dashed.push([m1,m2]);
        s.equalMarks.push([[b,m1],[m1,c]],[[a,m2],[m2,d]]);
      }
    }
  }

  // --- Углы вершин — рисуем дугу даже без числа ---
  {const angRx = raw.matchAll(/угол\s+([A-Za-z])/gi);
  for(const m of angRx){
    const lbl=m[1].toUpperCase();
    const vi=labs.indexOf(lbl);
    if(vi>=0&&pts[lbl]){
      const prev=labs[(vi+3)%4], next=labs[(vi+1)%4];
      if(pts[prev]&&pts[next]){
        // Ищем числовое значение
        const numRx=new RegExp('угол\\s+'+lbl+'[^=\\d]*[=\\s]\\s*(\\d+(?:[.,]\\d+)?)','i');
        const numM=raw.match(numRx);
        const label=numM?numM[1]+'°':'';
        s.angleMarks.push({v:pts[lbl],d1:pts[prev],d2:pts[next],label});
      }
    }
  }}

  // --- Биссектриса одиночная с буквами ---
  if(/биссектрис/.test(tl)&&!(ctx.features.includes('two_bisectors'))) {
    const bm = raw.match(/биссектрис[а-яёa-z0-9]*\s+(?:угл[а-яёa-z0-9]*\s+)?([A-Za-z])(?:\s+и\s+|\s*$|\s+[^A-Za-z])/i)
             || raw.match(/биссектрис[а-яёa-z0-9]*\s+(?:из\s+)?(?:вершины\s+)?([A-Za-z])\s/i);
    if(bm){
      const fromL=bm[1].toUpperCase();
      const idx=labs.indexOf(fromL);
      if(idx>=0){
        // Имя конечной точки биссектрисы
        const endM=raw.match(new RegExp('биссектрис[а-яёa-z0-9]*\\s+'+fromL+'([A-Za-z])','i'))
                 ||raw.match(new RegExp('биссектрис[а-яёa-z0-9]*[^.]*?([A-Za-z]{2})','i'));
        const endL=endM?endM[1].toUpperCase():'K';
        const pts4=labs.map(l=>pts[l]);
        const bd=quadBisDir(idx,pts4,labs);
        if(bd){
          const oppSides=sides.filter(([x,y])=>x!==fromL&&y!==fromL);
          let best=null,bestD=Infinity;
          const end_={x:bd.vp.x+bd.x*1000,y:bd.vp.y+bd.y*1000};
          for(const[sl1,sl2]of oppSides){
            const ip=lineIntersect(bd.vp,end_,pts[sl1],pts[sl2]);
            if(ip){const d_=Math.sqrt((ip.x-bd.vp.x)**2+(ip.y-bd.vp.y)**2);
              if(d_>1&&d_<bestD){bestD=d_;best=ip;}}
          }
          if(best){const ep=P(best.x,best.y,endL);s.dashed.push([pts[fromL],ep]);}
        }
      }
    }
  }

  // --- Вписанная окружность в четырёхугольник (incircle) ---
  // Существует только если сумма противоположных сторон равна (ромб, квадрат, некоторые трапеции)
  if(has('incircle') || /вписанн[а-яё]*\s+окружн|окружн[а-яё]*\s+вписан[^н]/i.test(raw)) {
    const pa=pts[A],pb=pts[B],pc=pts[C],pd=pts[D];
    if(pa&&pb&&pc&&pd) {
      // Центр вписанной окружности — точка равноудалённая от всех сторон
      // Для ромба и квадрата — это пересечение диагоналей
      // Для трапеции — на оси симметрии, если равнобедренная
      // Общий случай: находим через биссектрисы двух углов
      function bisDir2(v, a_, b_) {
        const da=dist(v,a_), db=dist(v,b_);
        if(da<1e-9||db<1e-9) return null;
        return {x:(a_.x-v.x)/da+(b_.x-v.x)/db, y:(a_.y-v.y)/da+(b_.y-v.y)/db};
      }
      const b1=bisDir2(pa,pd,pb);
      const b2=bisDir2(pb,pa,pc);
      let ic=null;
      if(b1&&b2) {
        const e1={x:pa.x+b1.x*1000,y:pa.y+b1.y*1000};
        const e2={x:pb.x+b2.x*1000,y:pb.y+b2.y*1000};
        ic=lineIntersect(pa,e1,pb,e2);
      }
      if(!ic) {
        // Запасной вариант: центроид
        ic={x:(pa.x+pb.x+pc.x+pd.x)/4, y:(pa.y+pb.y+pc.y+pd.y)/4};
      }
      // Радиус — расстояние от центра до стороны AB
      function distPtLine(p, a_, b_) {
        const dx=b_.x-a_.x, dy=b_.y-a_.y, len=Math.sqrt(dx*dx+dy*dy);
        if(len<1e-9) return 0;
        return Math.abs((p.x-a_.x)*dy-(p.y-a_.y)*dx)/len;
      }
      const ri = Math.min(
        distPtLine(ic,pa,pb), distPtLine(ic,pb,pc),
        distPtLine(ic,pc,pd), distPtLine(ic,pd,pa)
      );
      if(ri > 0.5) {
        const iLabel = raw.match(/центр[а-яё]*\s+вписанн[а-яё]*\s+([A-Z])|вписанн[а-яё]*\s+окружн[а-яё]*\s+с\s+центром\s+([A-Z])/i);
        const cl = (iLabel&&(iLabel[1]||iLabel[2]))||'O';
        const Oi = P(ic.x, ic.y, cl);
        s.circles.push({center:Oi, radius:ri});
        // Точки касания на каждой стороне
        function tangentPt(p, a_, b_) {
          const dx=b_.x-a_.x,dy=b_.y-a_.y,len2=dx*dx+dy*dy;
          const t=((p.x-a_.x)*dx+(p.y-a_.y)*dy)/len2;
          return {x:a_.x+t*dx, y:a_.y+t*dy};
        }
        const t1=tangentPt(ic,pa,pb), t2=tangentPt(ic,pb,pc);
        const t3=tangentPt(ic,pc,pd), t4=tangentPt(ic,pd,pa);
        [t1,t2,t3,t4].forEach(t => s.dashed.push([Oi, {x:t.x,y:t.y,label:''}]));
        // Прямые углы в точках касания
        [
          {v:{x:t1.x,y:t1.y,label:''},d1:Oi,d2:pa},
          {v:{x:t2.x,y:t2.y,label:''},d1:Oi,d2:pb},
          {v:{x:t3.x,y:t3.y,label:''},d1:Oi,d2:pc},
          {v:{x:t4.x,y:t4.y,label:''},d1:Oi,d2:pd},
        ].forEach(m => s.rightAngles.push(m));
      }
    }
  }

  // --- Описанная окружность вокруг четырёхугольника (circumcircle) ---
  // Существует только если четырёхугольник вписан в окружность (сумма противоположных углов = 180°)
  // Для квадрата, прямоугольника — всегда существует
  if(has('circumcircle') || /описанн[а-яё]*\s+окружн|окружн[а-яё]*\s+описан/i.test(raw)) {
    const pa=pts[A],pb=pts[B],pc=pts[C],pd=pts[D];
    if(pa&&pb&&pc&&pd) {
      // Описанная окружность: находим через описанную окружность треугольника ABC
      // и проверяем что D тоже лежит (или берём центроид как приближение)
      function circumcenter(p1,p2,p3) {
        const ax=p1.x,ay=p1.y,bx=p2.x,by=p2.y,cx=p3.x,cy=p3.y;
        const D_=2*(ax*(by-cy)+bx*(cy-ay)+cx*(ay-by));
        if(Math.abs(D_)<1e-9) return null;
        const ux=((ax*ax+ay*ay)*(by-cy)+(bx*bx+by*by)*(cy-ay)+(cx*cx+cy*cy)*(ay-by))/D_;
        const uy=((ax*ax+ay*ay)*(cx-bx)+(bx*bx+by*by)*(ax-cx)+(cx*cx+cy*cy)*(bx-ax))/D_;
        return {x:ux,y:uy};
      }
      let cc = circumcenter(pa,pb,pc);
      if(!cc) cc={x:(pa.x+pb.x+pc.x+pd.x)/4, y:(pa.y+pb.y+pc.y+pd.y)/4};
      // Если D не лежит на окружности — используем усреднённый центр
      const rA=dist(cc,pa), rD=dist(cc,pd);
      let rc;
      if(Math.abs(rA-rD)/Math.max(rA,0.1) > 0.15) {
        // D не лежит — берём центр как среднее всех описанных окружностей подтреугольников
        const cc2=circumcenter(pa,pb,pd);
        const cc3=circumcenter(pa,pc,pd);
        if(cc2&&cc3) {
          cc={x:(cc.x+cc2.x+cc3.x)/3, y:(cc.y+cc2.y+cc3.y)/3};
        }
      }
      rc = (dist(cc,pa)+dist(cc,pb)+dist(cc,pc)+dist(cc,pd))/4;
      if(rc>0.5) {
        const cLabel = raw.match(/центр[а-яё]*\s+описанн[а-яё]*\s+([A-Z])|описанн[а-яё]*\s+окружн[а-яё]*\s+с\s+центром\s+([A-Z])/i);
        const cl2=(cLabel&&(cLabel[1]||cLabel[2]))||'O';
        const Oc=P(cc.x,cc.y,cl2);
        s.circles.push({center:Oc,radius:rc});
        // Пунктирные радиусы к вершинам
        [pa,pb,pc,pd].forEach(v=>s.dashed.push([Oc,v]));
      }
    }
  }

  // --- Single bisector at a vertex in quad ---
  if(ctx.features.includes('bisector') || /биссектрис/.test(tl)) {
    // Определяем вершину, из которой проведена биссектриса
    // Порядок поиска: "биссектриса угла D", "из угла D", "биссектриса из вершины D", "биссектриса D"
    let fromL = null;
    {
      const m = raw.match(/биссектрис[а-яёa-z0-9]*\s+угл[а-яёa-z0-9]*\s+([A-Z])/i)
             || raw.match(/из\s+угл[а-яёa-z0-9]*\s+([A-Z])/i)
             || raw.match(/биссектрис[а-яёa-z0-9]*\s+(?:из\s+)?(?:вершины\s+)?([A-Z])\b/i)
             || raw.match(/биссектрис[а-яёa-z0-9]*\s+([A-Z])\s/i);
      if(m) {
        const cand = m[1].toUpperCase();
        if(labs.includes(cand)) fromL = cand;
      }
    }
    if(fromL) {
      const idx = labs.indexOf(fromL);
      const pts4 = labs.map(l => pts[l]);
      const bd = quadBisDir(idx, pts4, labs);
      if(bd) {
        // Имя конечной точки — ищем в тексте ("биссектриса AB" → B, или "точке E")
        const segM = raw.match(new RegExp('биссектрис[а-яёa-z0-9]*\\s+' + fromL + '([A-Za-z])', 'i'));
        const ptM  = raw.match(/в\s+точке\s+([A-Z])/i);
        let endL = null;
        if(segM) { const c=segM[1].toUpperCase(); if(!labs.includes(c)) endL=c; }
        if(!endL && ptM && !labs.includes(ptM[1].toUpperCase())) endL = ptM[1].toUpperCase();
        // Противоположная вершина (для ромба биссектриса = диагональ)
        const oppL = labs[(idx + 2) % 4];
        const oppPt = pts[oppL];
        // Проверяем, совпадает ли направление биссектрисы с направлением на oppPt
        const dirToOpp = oppPt ? { x: oppPt.x - bd.vp.x, y: oppPt.y - bd.vp.y } : null;
        const len_ = dirToOpp ? Math.hypot(dirToOpp.x, dirToOpp.y) : 0;
        const dotProd = dirToOpp && len_ > 0
          ? (bd.x * dirToOpp.x + bd.y * dirToOpp.y) / len_ : 0;
        const isRhombusDiag = dotProd > 0.97;
        if(isRhombusDiag && oppPt) {
          // Ромб: биссектриса = диагональ; рисуем до противоположной вершины
          s.dashed.push([pts[fromL], oppPt]);
          // Отметки равных полуугла
          const prev=labs[(idx+3)%4], next_=labs[(idx+1)%4];
          if(pts[prev]&&pts[next_]) {
            s.angleMarks.push({v:pts[fromL], d1:pts[prev], d2:oppPt, label:''});
            s.angleMarks.push({v:pts[fromL], d1:oppPt,    d2:pts[next_], label:''});
          }
          if(endL && endL !== oppL) P(oppPt.x, oppPt.y, endL);
        } else {
          // Общий случай: пересекаем с противоположными сторонами
          const oppSides = sides.filter(([x,y]) => x!==fromL && y!==fromL);
          let best = null, bestD = Infinity;
          const end_ = {x: bd.vp.x + bd.x*1000, y: bd.vp.y + bd.y*1000};
          for(const [sl1,sl2] of oppSides) {
            const ip = lineIntersect(bd.vp, end_, pts[sl1], pts[sl2]);
            if(ip) {
              const d_ = dist(bd.vp, ip);
              if(d_ > 1 && d_ < bestD) { bestD=d_; best=ip; }
            }
          }
          if(best) {
            // Выбрать имя конечной точки, не совпадающее с вершиной
            if(!endL || labs.includes(endL)) {
              for(const cand of ['E','K','P','T','Q']) {
                if(!labs.includes(cand) && !pts[cand]) { endL=cand; break; }
              }
            }
            const pE = P(best.x, best.y, endL || 'E');
            s.dashed.push([pts[fromL], pE]);
          }
        }
      }
    }
  }
}

// Add extra elements to a triangle (heights, medians, bisectors)
function addExtra(ctx,s,pts,vA,vB,vC,sAB,sBC,sAC){
  const tA=pts[vA],tB=pts[vB],tC=pts[vC];
  const tl=ctx.tl;
  const P=(x,y,l)=>{const p={x,y,label:l};if(l)s.points[l]=p;return p;};

  // --- Heights ---
  if(ctx.features.includes('height')||/высот/.test(tl)){
    const hm=ctx.raw.match(/высот[а-яёa-z0-9]*\s+([A-Z])([A-Z])?/);
    let fromV=null,hLabel=null;
    if(hm){fromV=hm[1];hLabel=hm[2]||'H';}
    if(!fromV){
      const hm2=ctx.raw.match(/высот[а-яёa-z0-9]*\s+из\s+(?:вершины\s+)?([A-Z])/);
      if(hm2)fromV=hm2[1];
    }
    if(!fromV)fromV=vA;
    if(!hLabel)hLabel='H';

    const fromPt=pts[fromV];
    const oppVerts=[vA,vB,vC].filter(v=>v!==fromV);
    const oppA=pts[oppVerts[0]],oppB=pts[oppVerts[1]];
    const foot=footPerp(fromPt,oppA,oppB);
    const H=P(foot.x,foot.y,hLabel);
    s.dashed.push([fromPt,H]);
    s.rightAngles.push({v:H,d1:fromPt,d2:oppB});
    // For obtuse triangles: if foot is OUTSIDE segment oppA-oppB → extend the base
    const dx=oppB.x-oppA.x,dy=oppB.y-oppA.y,len2=dx*dx+dy*dy;
    if(len2>0){
      const t=((foot.x-oppA.x)*dx+(foot.y-oppA.y)*dy)/len2;
      if(t<-0.01||t>1.01){
        // Foot is outside → draw dashed extension from nearest vertex to foot
        const nearest=t<0?oppA:oppB;
        s.dashed.push([nearest,H]);
      }
    }
  }

  // --- Medians ---
  if(ctx.features.includes('median')||/медиан/.test(tl)){
    const mm=ctx.raw.match(/медиан[а-яёa-z0-9]*\s+([A-Z])([A-Z])?/);
    let fromV=null,mLabel=null;
    if(mm){fromV=mm[1];mLabel=mm[2]||'M';}
    if(!fromV){
      const mm2=ctx.raw.match(/медиан[а-яёa-z0-9]*\s+из\s+(?:вершины\s+)?([A-Z])/);
      if(mm2)fromV=mm2[1];
    }
    if(!fromV)fromV=vB;
    if(!mLabel)mLabel='M';

    const fromPt=pts[fromV];
    const oppVerts=[vA,vB,vC].filter(v=>v!==fromV);
    const oppA=pts[oppVerts[0]],oppB=pts[oppVerts[1]];
    const M=P((oppA.x+oppB.x)/2,(oppA.y+oppB.y)/2,mLabel);
    s.dashed.push([fromPt,M]);
    s.equalMarks.push([[oppA,M],[M,oppB]]);
  }

  // --- Bisectors ---
  if(ctx.features.includes('bisector')||/биссектрис/.test(tl)){
    const bm=ctx.raw.match(/биссектрис[а-яёa-z0-9]*\s+([A-Z])([A-Z])?/);
    let fromV=null,bLabel=null;
    if(bm){fromV=bm[1];bLabel=bm[2]||'D';}
    if(!fromV)fromV=vA;
    if(!bLabel)bLabel='D';

    const fromPt=pts[fromV];
    const oppVerts=[vA,vB,vC].filter(v=>v!==fromV);
    const oppA=pts[oppVerts[0]],oppB=pts[oppVerts[1]];
    // Bisector divides opposite side in ratio of adjacent sides
    const dA=dist(fromPt,oppA),dB=dist(fromPt,oppB);
    const t=dA/(dA+dB);
    const D_=P(oppA.x+(oppB.x-oppA.x)*t, oppA.y+(oppB.y-oppA.y)*t, bLabel);
    s.dashed.push([fromPt,D_]);
  }

  // --- Diagonals in quad are handled elsewhere ---
}

function fmtNum(v){
  if(v===undefined||v===null)return'';
  if(abs(v-Math.round(v))<0.01)return String(Math.round(v));
  return v.toFixed(1);
}

// ============ RENDERER ============
function render(sol,W=720,H=540){
  const PAD=70,pts=sol.points,aX=[],aY=[];
  for(const p of Object.values(pts)){if(p.label!==undefined)aX.push(p.x);aY.push(p.y);}
  for(const c of sol.circles){aX.push(c.center.x-c.radius,c.center.x+c.radius);aY.push(c.center.y-c.radius,c.center.y+c.radius);}
  if(!aX.length)return errSvg(W,H);

  const mnX=min(...aX),mxX=max(...aX),mnY=min(...aY),mxY=max(...aY);
  const rX=mxX-mnX||10,rY=mxY-mnY||10,dW=W-2*PAD,dH=H-2*PAD;
  const sc=min(dW/rX,dH/rY);
  const tx=x=>PAD+(x-mnX)*sc+(dW-rX*sc)/2;
  const ty=y=>H-PAD-(y-mnY)*sc-(dH-rY*sc)/2;

  let o=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  o+=`<defs><filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity=".06"/></filter></defs>`;
  o+=`<rect width="${W}" height="${H}" fill="#faf9f7" rx="12" filter="url(#sh)"/>`;
  o+=`<style>
.L{stroke:#1b1b1e;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.D{stroke:#9a9590;stroke-width:1.5;stroke-dasharray:7,4;stroke-linecap:round;fill:none}
.C{stroke:#1b1b1e;stroke-width:2;fill:none}
.P{fill:#1b1b1e}
.T{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;fill:#1b1b1e;font-style:italic;font-weight:600}
.V{font-family:'DM Sans',sans-serif;font-size:12px;fill:#8a7e73}
.R{stroke:#b44a2d;stroke-width:1.5;fill:none}
.E{stroke:#2d6b4f;stroke-width:2;stroke-linecap:round}
.A{stroke:#b44a2d;stroke-width:1.3;fill:none}
.AL{font-family:'Cormorant Garamond',serif;font-size:14px;fill:#b44a2d;font-style:italic}
.HA{stroke:#b44a2d;stroke-width:3.5;fill:none;stroke-linecap:round;opacity:.55}
</style>`;

  // Circles
  for(const c of sol.circles)
    o+=`<circle cx="${tx(c.center.x).toFixed(1)}" cy="${ty(c.center.y).toFixed(1)}" r="${(c.radius*sc).toFixed(1)}" class="C"/>`;

  // Highlighted arcs on circle
  for(const ha of sol.highlightArcs||[]){
    const cx_=tx(ha.center.x),cy_=ty(ha.center.y),r_=ha.radius*sc;
    const p1x=tx(ha.p1.x),p1y=ty(ha.p1.y),p2x=tx(ha.p2.x),p2y=ty(ha.p2.y);
    // Compute angles in screen space (y inverted)
    const a1=atan2(p1y-cy_,p1x-cx_), a2=atan2(p2y-cy_,p2x-cx_);
    // Draw minor arc from p1 to p2
    let sweep=1, largeArc=0;
    // Determine if we need large arc
    let diff=a2-a1; if(diff<0)diff+=2*PI;
    if(ha.minor){largeArc=diff>PI?1:0;}
    else{largeArc=diff>PI?0:1;}
    o+=`<path d="M${p1x.toFixed(1)},${p1y.toFixed(1)}A${r_.toFixed(1)},${r_.toFixed(1)},0,${largeArc},${sweep},${p2x.toFixed(1)},${p2y.toFixed(1)}" class="HA"/>`;
  }

  // Lines
  for(const[p1,p2]of sol.lines)
    o+=`<line x1="${tx(p1.x).toFixed(1)}" y1="${ty(p1.y).toFixed(1)}" x2="${tx(p2.x).toFixed(1)}" y2="${ty(p2.y).toFixed(1)}" class="L"/>`;

  // Arrows helper
  function arrowHead(x1,y1,x2,y2,size=10){
    const ang=atan2(y2-y1,x2-x1);
    const a1=ang+PI*0.8, a2=ang-PI*0.8;
    return `M${x2.toFixed(1)},${y2.toFixed(1)}L${(x2+size*cos(a1)).toFixed(1)},${(y2+size*sin(a1)).toFixed(1)}M${x2.toFixed(1)},${y2.toFixed(1)}L${(x2+size*cos(a2)).toFixed(1)},${(y2+size*sin(a2)).toFixed(1)}`;
  }
  // Rays — стрелка на конце
  for(const r_ of sol.rays||[]){
    const x1=tx(r_.from.x),y1=ty(r_.from.y),x2=tx(r_.to.x),y2=ty(r_.to.y);
    o+=`<path d="${arrowHead(x1,y1,x2,y2)}" class="L"/>`;
  }
  // Full lines — без стрелок (прямая обозначается просто линией)
  for(const fl of sol.fullLines||[]){
    const x1=tx(fl.p1.x),y1=ty(fl.p1.y),x2=tx(fl.p2.x),y2=ty(fl.p2.y);
    o+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="L"/>`;
  }

  // Dashed
  for(const[p1,p2]of sol.dashed)
    o+=`<line x1="${tx(p1.x).toFixed(1)}" y1="${ty(p1.y).toFixed(1)}" x2="${tx(p2.x).toFixed(1)}" y2="${ty(p2.y).toFixed(1)}" class="D"/>`;

  // Right angles
  for(const m of sol.rightAngles){
    const vx=tx(m.v.x),vy=ty(m.v.y);
    const d1x=tx(m.d1.x),d1y=ty(m.d1.y),d2x=tx(m.d2.x),d2y=ty(m.d2.y);
    const l1=hypot(d1x-vx,d1y-vy),l2=hypot(d2x-vx,d2y-vy);
    if(l1<2||l2<2)continue;
    const sz=12;
    const ux1=(d1x-vx)/l1*sz,uy1=(d1y-vy)/l1*sz,ux2=(d2x-vx)/l2*sz,uy2=(d2y-vy)/l2*sz;
    o+=`<path d="M${(vx+ux1).toFixed(1)},${(vy+uy1).toFixed(1)}L${(vx+ux1+ux2).toFixed(1)},${(vy+uy1+uy2).toFixed(1)}L${(vx+ux2).toFixed(1)},${(vy+uy2).toFixed(1)}" class="R"/>`;
  }

  // Angle marks (arcs with labels)
  for(const m of sol.angleMarks||[]){
    const vx=tx(m.v.x),vy=ty(m.v.y);
    const p1x=tx(m.d1.x),p1y=ty(m.d1.y),p2x=tx(m.d2.x),p2y=ty(m.d2.y);
    let a1=atan2(p1y-vy,p1x-vx),a2=atan2(p2y-vy,p2x-vx);
    if(a2<a1)a2+=2*PI;
    if(a2-a1>PI){const tmp=a1;a1=a2;a2=tmp+2*PI;}
    const r=22;
    o+=`<path d="M${(vx+r*cos(a1)).toFixed(1)},${(vy+r*sin(a1)).toFixed(1)}A${r},${r},0,0,1,${(vx+r*cos(a2)).toFixed(1)},${(vy+r*sin(a2)).toFixed(1)}" class="A"/>`;
    const mid_=(a1+a2)/2;
    o+=`<text x="${(vx+34*cos(mid_)).toFixed(1)}" y="${(vy+34*sin(mid_)).toFixed(1)}" class="AL" text-anchor="middle" dominant-baseline="middle">${m.label||''}</text>`;
  }

  // Inscribed angle arc marks
  for(const m of sol.arcMarks||[]){
    const vx=tx(m.vertex.x),vy=ty(m.vertex.y);
    const p1x=tx(m.p1.x),p1y=ty(m.p1.y),p2x=tx(m.p2.x),p2y=ty(m.p2.y);
    let a1=atan2(p1y-vy,p1x-vx),a2=atan2(p2y-vy,p2x-vx);
    if(a2<a1)a2+=2*PI;
    const r=25;
    o+=`<path d="M${(vx+r*cos(a1)).toFixed(1)},${(vy+r*sin(a1)).toFixed(1)}A${r},${r},0,${(a2-a1>PI)?1:0},1,${(vx+r*cos(a2)).toFixed(1)},${(vy+r*sin(a2)).toFixed(1)}" class="A"/>`;
    const mid_=(a1+a2)/2;
    o+=`<text x="${(vx+38*cos(mid_)).toFixed(1)}" y="${(vy+38*sin(mid_)).toFixed(1)}" class="AL" text-anchor="middle" dominant-baseline="middle">${m.label||''}</text>`;
  }

  // Equal marks
  for(let gi=0;gi<sol.equalMarks.length;gi++){
    const ticks=gi+1;
    for(const pair of sol.equalMarks[gi]){
      if(pair.length!==2)continue;const[p1,p2]=pair;
      const mx=(tx(p1.x)+tx(p2.x))/2,my=(ty(p1.y)+ty(p2.y))/2;
      const dx=tx(p2.x)-tx(p1.x),dy=ty(p2.y)-ty(p1.y),len=hypot(dx,dy);if(len<2)continue;
      const nx=-dy/len,ny=dx/len;
      for(let i=0;i<ticks;i++){
        const off=(i-(ticks-1)/2)*5;
        const cx_=mx+dx/len*off,cy_=my+dy/len*off;
        o+=`<line x1="${(cx_-nx*7).toFixed(1)}" y1="${(cy_-ny*7).toFixed(1)}" x2="${(cx_+nx*7).toFixed(1)}" y2="${(cy_+ny*7).toFixed(1)}" class="E"/>`;
      }
    }
  }

  // Dimension labels
  for(const dm of sol.dims){
    const mx=(tx(dm.p1.x)+tx(dm.p2.x))/2,my=(ty(dm.p1.y)+ty(dm.p2.y))/2;
    const dx=ty(dm.p1.y)-ty(dm.p2.y),dy=tx(dm.p2.x)-tx(dm.p1.x);
    const len=hypot(dx,dy)||1;
    o+=`<text x="${(mx+dx/len*16).toFixed(1)}" y="${(my+dy/len*16).toFixed(1)}" class="V" text-anchor="middle" dominant-baseline="middle">${dm.text}</text>`;
  }

  // Points & labels (smart placement)
  const cx_=Object.values(pts).reduce((s,p)=>s+tx(p.x),0)/max(Object.keys(pts).length,1);
  const cy_=Object.values(pts).reduce((s,p)=>s+ty(p.y),0)/max(Object.keys(pts).length,1);
  for(const[label,p]of Object.entries(pts)){
    if(!label)continue;
    const px=tx(p.x),py=ty(p.y);
    o+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3" class="P"/>`;
    let dx=px-cx_,dy=py-cy_,d=hypot(dx,dy);
    if(d<1){dx=0;dy=-1;d=1;}
    const off=20;
    o+=`<text x="${(px+dx/d*off).toFixed(1)}" y="${(py+dy/d*off).toFixed(1)}" class="T" text-anchor="middle" dominant-baseline="middle">${label}</text>`;
  }

  return o+'</svg>';
}

function errSvg(W,H){
  return`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="#faf9f7" rx="12"/><text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#b44a2d" font-size="16" font-family="DM Sans,sans-serif">Не удалось построить чертёж. Попробуйте переформулировать задачу.</text></svg>`;
}

return{parse,solve,render};
})();

// ====== UI ======
const ta=document.getElementById('ta'),genBtn=document.getElementById('gen'),clrBtn=document.getElementById('clr');
const exSel=document.getElementById('ex'),svgBox=document.getElementById('svg-box');
const ph=document.getElementById('ph'),errEl=document.getElementById('err'),nfoEl=document.getElementById('nfo');
const dlBar=document.getElementById('dlbar');let curSvg='';

EXAMPLES.forEach((e,i)=>{const o=document.createElement('option');o.value=i;o.textContent=e.t;exSel.appendChild(o);});
exSel.addEventListener('change',function(){if(this.value!==''){ta.value=EXAMPLES[+this.value].s;ta.focus();}});
genBtn.addEventListener('click',generate);
ta.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')generate();});
clrBtn.addEventListener('click',()=>{ta.value='';svgBox.innerHTML='';curSvg='';ph.style.display='';dlBar.classList.remove('vis');errEl.classList.remove('vis');nfoEl.classList.remove('vis');exSel.selectedIndex=0;ta.focus();const cp=document.getElementById('clarify-panel');if(cp)cp.remove();});
document.getElementById('dl').addEventListener('click',()=>{if(!curSvg)return;const b=new Blob([curSvg],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='geometry.svg';a.click();URL.revokeObjectURL(a.href);});
document.getElementById('cp').addEventListener('click',function(){if(!curSvg)return;navigator.clipboard.writeText(curSvg).then(()=>{this.textContent='✓ Скопировано';setTimeout(()=>this.innerHTML='⎘ Копировать',1500);});});

// Geo keywords — any real geometry problem must contain at least one
const GEO_KEYWORDS=['треугольник','трапеци','параллелограмм','ромб','прямоугольник','квадрат',
  'окружность','круг','радиус','диаметр','хорда','касательн','секущ',
  'высота','медиана','биссектрис','диагональ','перпендикуляр','серединн',
  'вписан','описан','угол','градус','сторон','основани','периметр','площадь',
  'отрезок','прямая','прямую','прямой','прямые','луч','точка','центр','вершин','гипотенуза','катет',
  'равнобедренн','тупоугольн','остроугольн','параллельн','пересека','проведен','лежит'];
function hasGeoContent(text){
  const tl=text.toLowerCase();
  if(GEO_KEYWORDS.some(k=>tl.includes(k)))return true;
  if(/[a-z]{2}\s*=\s*\d/.test(tl))return true;
  if(/=\s*\d+\s*°/.test(tl))return true;
  // Two capital letters = a point/segment label (e.g. "прямая AS", "отрезок KP")
  if(/[A-Z]{2}/.test(text))return true;
  return false;
}

function generate(){
  const text=ta.value.trim();if(!text){showErr('Введите условие задачи');return;}
  errEl.classList.remove('vis');nfoEl.classList.remove('vis');
  if(!hasGeoContent(text)){
    ph.style.display='none';
    showErr('Условие не содержит геометрических данных');
    showClarifyPanel('no_geo');
    return;
  }
  try{
    const parsed=GEO.parse(text);
    const solution=GEO.solve(parsed);
    curSvg=GEO.render(solution);
    svgBox.innerHTML=curSvg;ph.style.display='none';dlBar.classList.add('vis');
    const cp=document.getElementById('clarify-panel');if(cp)cp.remove();

    const nm={tangent_secant:'Касательная + секущая',tangent_only:'Касательная',two_tangents:'Две касательные',chord_perp_radius:'Хорда ⊥ радиусу',chord_distance:'Хорда → расстояние',inscribed_angle:'Вписанный угол',central_angle:'Центральный угол',central_and_inscribed:'Центральный + вписанный',inscribed_angle_diameter:'Угол на диаметр (Фалес)',inscribed_angle_tangent:'Вписанный угол + касательная',two_inscribed_angles:'Два вписанных на одну дугу',diameter_angle:'Угол на диаметр',circle_on_side_tangent:'Окр. на стороне △ + касательная',tangent_angle_arc:'Касательная + дуга',right_tri_height_circle:'△ + окр. на высоте',tri_circumscribed:'△ + описанная окр.',tri_incircle:'△ + вписанная окр.',tri_inscribed_in_circle:'△ вписан в окр.',circle_only:'Окружность',lines_only:'Прямые/отрезки',triangle:'Треугольник',trapezoid:'Трапеция',trapezoid_perp_diag:'Трапеция: диагонали ⊥',parallelogram:'Параллелограмм',pgram_bisectors:'Пар-мм: биссектрисы',rhombus:'Ромб',rhombus_diag_dist:'Ромб: расст. до стороны',rectangle:'Прямоугольник',square:'Квадрат',perp_bisector:'Серединный ⊥',parallel_segments:'Отрезки на параллельных',tri_perp_median:'△: ⊥ к медиане',tri_parallel_line:'△ + параллельная прямая'};
    const parts=[nm[parsed.scenario]||parsed.scenario];
    const extras=parsed.features.filter(f=>['height','median','bisector','diagonal','incircle','circumcircle','central_angle','inscribed_angle','diameter'].includes(f));
    const eNames={height:'высота',median:'медиана',bisector:'биссектриса',diagonal:'диагональ',incircle:'вписанная окр.',circumcircle:'описанная окр.',central_angle:'центральный угол',inscribed_angle:'вписанный угол',diameter:'диаметр'};
    extras.forEach(e=>parts.push(eNames[e]||e));
    for(const seg in parsed.segments)parts.push(`${seg}=${fmtN(parsed.segments[seg])}`);
    for(const[l,v]of Object.entries(parsed.angles))parts.push(`∠${l}=${v}°`);
    if(parsed.radiusVal)parts.push(`R=${parsed.radiusVal}`);
    nfoEl.innerHTML='<b>Распознано:</b> '+parts.join(' · ');nfoEl.classList.add('vis');
  }catch(e){showErr('Ошибка: '+e.message);ph.style.display='none';showClarifyPanel(e.message);}
}
function fmtN(v){return Math.abs(v-Math.round(v))<.01?Math.round(v):v.toFixed(1);}
function showErr(m){errEl.textContent=m;errEl.classList.add('vis');}

function showClarifyPanel(errMsg){
  svgBox.innerHTML='';
  const tips=[
    {icon:'',title:'Укажите фигуру явно',hint:'Напишите: «треугольник ABC», «трапеция ABCD», «окружность с центром O»'},
    {icon:'',title:'Добавьте числовые данные',hint:'Укажите длины сторон, радиус или углы: «AB = 6», «радиус = 5», «угол A = 60°»'},
    {icon:'',title:'Используйте заглавные буквы',hint:'Точки и вершины обозначайте заглавными латинскими буквами: A, B, C, O'},
    {icon:'',title:'Уточните вспомогательные элементы',hint:'Явно укажите: «проведена высота AH», «биссектриса BD», «медиана AM»'},
  ];
  const panel=document.createElement('div');
  panel.id='clarify-panel';
  panel.style.cssText='width:100%;max-width:560px;padding:8px 0 4px;display:flex;flex-direction:column;gap:12px;animation:fadeInUp .3s ease';
  panel.innerHTML=`
    <style>
      @keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      #clarify-panel .cp-head{display:flex;align-items:center;gap:10px;padding:14px 18px;background:rgba(180,74,45,.06);border:1.5px solid rgba(180,74,45,.14);border-radius:14px}
      #clarify-panel .cp-head svg{flex-shrink:0;width:28px;height:28px;stroke:#b44a2d;fill:none;stroke-width:2;stroke-linecap:round}
      #clarify-panel .cp-head-text{font-size:.88rem;color:#b44a2d;font-weight:600;line-height:1.4}
      #clarify-panel .cp-head-sub{font-size:.78rem;color:#c26040;font-weight:400;margin-top:2px}
      #clarify-panel .cp-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.05rem;font-weight:600;color:#1b1b1e;text-align:center;letter-spacing:-.01em}
      #clarify-panel .cp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
      @media(max-width:500px){#clarify-panel .cp-grid{grid-template-columns:1fr}}
      #clarify-panel .cp-tip{padding:12px 14px;border-radius:12px;border:1.5px solid #d4d0cb;background:#f3f1ee;display:flex;gap:10px;align-items:flex-start}
      #clarify-panel .cp-tip-icon{font-size:1.2rem;flex-shrink:0;margin-top:1px}
      #clarify-panel .cp-tip-title{font-size:.8rem;font-weight:600;color:#1b1b1e;margin-bottom:3px}
      #clarify-panel .cp-tip-hint{font-size:.74rem;color:#8a8680;line-height:1.45}
      #clarify-panel .cp-ex-btn{width:100%;padding:10px 18px;border-radius:10px;background:#2d6b4f;color:#fff;border:none;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;transition:.15s;box-shadow:0 2px 8px rgba(45,107,79,.2)}
      #clarify-panel .cp-ex-btn:hover{filter:brightness(1.1)}
    </style>
    <div class="cp-head">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <div>
        <div class="cp-head-text">Не удалось распознать условие задачи</div>
        <div class="cp-head-sub">Пожалуйста, уточните формулировку по советам ниже</div>
      </div>
    </div>
    <div class="cp-title">Как уточнить условие?</div>
    <div class="cp-grid">${tips.map(t=>`
      <div class="cp-tip">
        <div class="cp-tip-icon">${t.icon}</div>
        <div>
          <div class="cp-tip-title">${t.title}</div>
          <div class="cp-tip-hint">${t.hint}</div>
        </div>
      </div>`).join('')}
    </div>
    <button class="cp-ex-btn" id="clarifyExBtn"> Посмотреть примеры задач</button>
  `;
  svgBox.appendChild(panel);
  document.getElementById('clarifyExBtn').addEventListener('click',openModal);
}

// ====== EXAMPLES MODAL ======
const EX_CATS=[
  {id:'circle', label:'Окружность', icon:'',
   items: EXAMPLES.filter((_,i)=>i<=6)},
  {id:'triangle', label:'Треугольники', icon:'',
   items: EXAMPLES.filter((_,i)=>i>=7&&i<=14)},
  {id:'quad', label:'Четырёхугольники', icon:'',
   items: EXAMPLES.filter((_,i)=>i>=15&&i<=21)},
  {id:'angles', label:'Углы', icon:'',
   items: EXAMPLES.filter((_,i)=>i>=22&&i<=28)},

];

const modal=document.getElementById('exModal');
const modalTabs=document.getElementById('modalTabs');
const modalBody=document.getElementById('modalBody');
let activeCat=0;

function renderModalTabs(){
  modalTabs.innerHTML='';
  EX_CATS.forEach((cat,i)=>{
    const btn=document.createElement('button');
    btn.className='mtab'+(i===activeCat?' active':'');
    btn.textContent=cat.icon+' '+cat.label;
    btn.addEventListener('click',()=>{activeCat=i;renderModalTabs();renderModalGrid();});
    modalTabs.appendChild(btn);
  });
}

function renderModalGrid(){
  const cat=EX_CATS[activeCat];
  modalBody.innerHTML='';
  const grid=document.createElement('div');
  grid.className='ex-grid';
  cat.items.forEach(ex=>{
    const card=document.createElement('button');
    card.className='ex-card';
    card.innerHTML=`<div class="ex-card-title">${ex.t}</div><div class="ex-card-text">${ex.s}</div>`;
    card.addEventListener('click',()=>{
      ta.value=ex.s;
      closeModal();
      ta.focus();
      generate();
    });
    grid.appendChild(card);
  });
  modalBody.appendChild(grid);
}

function openModal(){activeCat=0;renderModalTabs();renderModalGrid();modal.classList.add('open');document.body.style.overflow='hidden';}
function closeModal(){modal.classList.remove('open');document.body.style.overflow='';}

document.getElementById('exBtn').addEventListener('click',openModal);
document.getElementById('modalClose').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeModal();});
</script>
