   if(m) ctx.pointsOnLine.push({point:m[1].toUpperCase(), line:m[2].toUpperCase(), isMid:true});}
  {// Pattern 5: "точки X и Y лежат на CD и AB соответственно"
   const m=clean.match(/точк[а-яёa-z]*\s+([A-Z])\s+и\s+([A-Z])\s+леж[а-яёa-z]*\s+на\s+([A-Z]{2})\s+и\s+([A-Z]{2})/i);
   if(m){
     if(!ctx.pointsOnLine.find(p=>p.point===m[1].toUpperCase()))
       ctx.pointsOnLine.push({point:m[1].toUpperCase(), line:m[3].toUpperCase()});
     if(!ctx.pointsOnLine.find(p=>p.point===m[2].toUpperCase()))
       ctx.pointsOnLine.push({point:m[2].toUpperCase(), line:m[4].toUpperCase()});
   }}
  {// Pattern 6: "точки X и Y лежат на них соответственно" — anaphora for parallelPair
   const m=clean.match(/точк[а-яёa-z]*\s+([A-Z])\s+и\s+([A-Z])\s+леж[а-яёa-z]*\s+на\s+(?:них|этих\s+прям[а-яёa-z]*|прям[а-яёa-z]*\s+соответственно)/i);
   if(m&&ctx.parallelPair&&ctx.parallelPair.length>=2){
     const pt1=m[1].toUpperCase(), pt2=m[2].toUpperCase();
     if(!ctx.pointsOnLine.find(p=>p.point===pt1))
       ctx.pointsOnLine.push({point:pt1, line:ctx.parallelPair[0]});
     if(!ctx.pointsOnLine.find(p=>p.point===pt2))
       ctx.pointsOnLine.push({point:pt2, line:ctx.parallelPair[1]});
   }}
  {// Pattern 7: "X лежит на ней" / "X лежит на одной из них" — anaphora single line
   const m=clean.match(/([A-Z])\s+лежит\s+на\s+(?:ней|одной\s+из\s+них)/i);
   if(m&&ctx.parallelPair&&!ctx.pointsOnLine.find(p=>p.point===m[1].toUpperCase()))
     ctx.pointsOnLine.push({point:m[1].toUpperCase(), line:ctx.parallelPair[1]});
  }
  // ── "через них проведена прямая" — resolve AFTER pointsOnLine is known ──
  {for(const m of clean.matchAll(/через\s+(?:них|них\s+всех)\s+провед[а-яёa-z]*\s+(?:прям[а-яёa-z]*|отрезо[а-яёa-z]*|луч[а-яёa-z]*)\s*([A-Z]{2})?/gi)){
     const label=(m[1]||'').toUpperCase();
     const allPts=(ctx.pointsOnLine||[]).map(p=>p.point);
     if(allPts.length>=2)
       ctx.linesThrough.push({through:allPts.slice(0,2), kind:'line', label, anaphora:true});
     else if(allPts.length===1)
       ctx.linesThrough.push({through:[allPts[0]], kind:'line', label, anaphora:true});
  }}

  // Auto-add the line objects referenced by pointsOnLine
  for(const pol of ctx.pointsOnLine){
    if(!ctx.lineObjects.find(o=>o.label===pol.line)){
      // Use 'line' kind by default (прямая), user can override with explicit отрезок/луч
      const kindHint= /отрезок|отрезка/i.test(tl)?'segment':/луч/i.test(tl)?'ray':'line';
      ctx.lineObjects.push({kind:kindHint, label:pol.line});
    }
  }
  // Дедупликация
  {const seen=new Set();ctx.lineObjects=ctx.lineObjects.filter(o=>{const k=o.kind+o.label;if(seen.has(k))return false;seen.add(k);return true;});}
  // Если просто сказано "прямая" / "отрезок" / "луч" без букв — добавляем безымянные
  if(!ctx.lineObjects.length){
    if(has('line'))   ctx.lineObjects.push({kind:'line',   label:''});
    if(has('segment'))ctx.lineObjects.push({kind:'segment',label:''});
    if(has('ray'))    ctx.lineObjects.push({kind:'ray',    label:''});
  }

  // ===== 8. SCENARIO CLASSIFICATION =====
  if(has('circle')){
    // --- Четырёхугольник + окружность (вписанная/описанная) — высший приоритет ---
    if(has('rhombus')&&(has('incircle')||has('circumcircle')||has('inscribed')||has('circumscribed')))ctx.scenario='rhombus';
    else if(has('square')&&(has('incircle')||has('circumcircle')||has('inscribed')||has('circumscribed')))ctx.scenario='square';
    else if(has('trapezoid')&&(has('incircle')||has('circumcircle')||has('inscribed')||has('circumscribed')))ctx.scenario='trapezoid';
    else if(has('parallelogram')&&(has('incircle')||has('circumcircle')||has('inscribed')||has('circumscribed')))ctx.scenario='parallelogram';
    else if(has('rectangle')&&(has('incircle')||has('circumcircle')||has('inscribed')||has('circumscribed')))ctx.scenario='rectangle';
    // --- Triangle + circle combinations first (highest priority) ---
    else if(has('center_on_side')&&has('triangle'))ctx.scenario='circle_on_side_tangent';
    else if(has('triangle')&&has('tangent')&&has('passes_through'))ctx.scenario='circle_on_side_tangent';
    else if(has('triangle')&&has('diameter')&&has('height'))ctx.scenario='right_tri_height_circle';
    else if(has('triangle')&&has('incircle'))ctx.scenario='tri_incircle';
    else if(has('triangle')&&(has('circumscribed')||has('circumcircle'))&&!has('incircle'))ctx.scenario='tri_circumscribed';
    else if(has('triangle')&&has('inscribed')&&!has('inscribed_angle'))ctx.scenario='tri_inscribed_in_circle';
    // --- Auto-detect from angles ---
    // If we have any angle marked as "central_*" → central angle problem
    // Если несколько вписанных + центральный → рисуем все вписанные + центральный
    else if(has('central_angle')&&has('inscribed_angle')&&(ctx.inscribedCount>1||/два|три|четыре|пять|шесть|семь|восемь|девять|десять|несколько/i.test(tl)||/\d+\s+вписанн/i.test(tl)))ctx.scenario='two_inscribed_angles';
    else if(has('central_angle')&&has('inscribed_angle'))ctx.scenario='central_and_inscribed';
    else if(has('central_angle'))ctx.scenario='central_angle';
    else if(has('inscribed_angle')&&(ctx.twoInscribedAngles||ctx.inscribedCount>1||/два|три|четыре|пять|шесть|семь|восемь|девять|десять|несколько/i.test(tl)||/\d+\s+вписанн/i.test(tl)))ctx.scenario='two_inscribed_angles';
    else if(has('inscribed_angle')&&has('tangent'))ctx.scenario='inscribed_angle_tangent';
    else if(has('inscribed_angle')&&has('diameter'))ctx.scenario='inscribed_angle_diameter';
    else if(has('inscribed_angle'))ctx.scenario='inscribed_angle';
    // --- Auto-detect from segments/distances ---
    // Tangent + secant from same external point
    else if(has('tangent')&&has('secant'))ctx.scenario='tangent_secant';
    // Two tangents from point
    else if(has('tangent')&&(ctx.distVal||/две\s+касательн/i.test(tl)))ctx.scenario='two_tangents';
    // Single tangent to circle — no secant, no triangle
    else if(has('tangent')&&!has('triangle')&&!has('incircle')&&!has('secant'))ctx.scenario='tangent_only';
    // Tangent with secant (fallback)
    else if(has('tangent')&&!has('triangle')&&!has('incircle'))ctx.scenario='tangent_secant';
    // Chord problems
    else if(has('chord')&&has('perpendicular'))ctx.scenario='chord_perp_radius';
    else if(has('chord'))ctx.scenario='chord_distance';
    // Diameter (Thales)
    else if(has('diameter')&&!has('triangle'))ctx.scenario='diameter_angle';
    // Tangent + arc
    else if(has('tangent')&&has('arc_given'))ctx.scenario='tangent_angle_arc';
    // --- Auto-detect from parsed data ---
    // If we found an angle > 0 with a 3-letter label containing O → central angle
    else{ let foundCentral=false,foundInscribed=false;
      for(const k of Object.keys(ctx.angles)){
        if(k.startsWith('central_'))foundCentral=true;
        if(k.startsWith('inscribed_'))foundInscribed=true;
      }
      if(foundCentral&&foundInscribed) ctx.scenario='central_and_inscribed';
      else if(foundCentral) ctx.scenario='central_angle';
      else if(foundInscribed) ctx.scenario='inscribed_angle';
      // Fallback: triangle+circle → incircle if вписан, else circumscribed
      else if(has('triangle')&&has('incircle')) ctx.scenario='tri_incircle';
      else if(has('triangle')) ctx.scenario='tri_circumscribed';
      else ctx.scenario='circle_only';
    }
  }
  // Если нашли линейные объекты И нет геометрической фигуры → lines_only
  // Also trigger if we have pointsOnLine entries
  if(!ctx.scenario&&(has('point_on_line')||ctx.pointsOnLine&&ctx.pointsOnLine.length)&&
     !has('circle')&&!has('triangle')&&!has('trapezoid')&&!has('parallelogram')&&!has('rhombus')&&!has('rectangle')&&!has('square'))
    ctx.scenario='lines_only';
  if(!ctx.scenario&&ctx.lineObjects&&ctx.lineObjects.length&&
     !has('circle')&&!has('triangle')&&!has('trapezoid')&&!has('parallelogram')&&!has('rhombus')&&!has('rectangle')&&!has('square'))
    ctx.scenario='lines_only';

  if(!ctx.scenario){
    if(has('perp_bisector'))ctx.scenario='perp_bisector';
    else if(has('parallel_lines')&&has('intersect_at'))ctx.scenario='parallel_segments';
    else if(has('parallel_lines')&&!has('triangle')&&!has('trapezoid')&&!has('parallelogram'))ctx.scenario='lines_only';
    else if(has('triangle')&&has('parallel_lines'))ctx.scenario='tri_parallel_line';
    else if(has('triangle')&&ctx.perpToMedian)ctx.scenario='tri_perp_median';
    else if(has('triangle'))ctx.scenario='triangle';
    else if(has('trapezoid')&&ctx.diagPerp)ctx.scenario='trapezoid_perp_diag';
    else if(has('trapezoid'))ctx.scenario='trapezoid';
    else if(has('parallelogram')&&has('two_bisectors'))ctx.scenario='pgram_bisectors';
    else if(has('parallelogram'))ctx.scenario='parallelogram';
    else if(has('rhombus')&&ctx.diagToSideDist)ctx.scenario='rhombus_diag_dist';
    else if(has('rhombus'))ctx.scenario='rhombus';
    else if(has('rectangle'))ctx.scenario='rectangle';
    else if(has('square'))ctx.scenario='square';
    // If input is just two capital letters (e.g. "FG") → draw a line by default
    else if(/^[A-Za-z]{2}$/.test(text.trim())||/^[A-Za-z]{2}$/.test(clean.trim())){
      const lbl=(text.trim()||clean.trim()).toUpperCase();
      ctx.lineObjects=[{kind:'line',label:lbl}];
      ctx.scenario='lines_only';
    }
    else ctx.scenario='triangle';
  }

  // ===== 9. COMPAT PROPS + AUTO-TYPE DETECTION =====
  // Auto-detect 'right' from angles (even without "прямоугольный" in text)
  for(const v of Object.values(ctx.angles)){
    if(Math.abs(v-90)<0.5 && !has('right')){ ctx.features.push('right'); break; }
  }
  // Auto-detect 'obtuse' from angles > 90°
  for(const v of Object.values(ctx.angles)){
    if(v>90 && !has('obtuse')){ ctx.features.push('obtuse'); break; }
  }
  ctx.triProps={};
  if(has('isosceles')&&has('triangle'))ctx.triProps.isosceles=true;
  if(has('equilateral'))ctx.triProps.equilateral=true;
  if(has('right')&&!has('trapezoid'))ctx.triProps.right=true;
  if(has('obtuse'))ctx.triProps.obtuse=true;
  if(has('acute'))ctx.triProps.acute=true;
  ctx.quadProps={};
  if(has('isosceles')&&has('trapezoid'))ctx.quadProps.isosceles=true;
  if(has('right')&&has('trapezoid'))ctx.quadProps.right=true;
  return ctx;
}

// ============ UNIVERSAL SOLVER ============
function solve(ctx){
  const s={points:{},circles:[],lines:[],dashed:[],rightAngles:[],arcMarks:[],equalMarks:[],dims:[],angleMarks:[]};
  const P=(x,y,l)=>{const p={x,y,label:l};if(l)s.points[l]=p;return p;};
  const segs=ctx.segments, R=ctx.radiusVal, F=ctx.features;
  const has=f=>F.includes(f);

  const S=ctx.scenario;

  // ===================== TRIANGLE (universal) =====================
  if(S==='triangle'||S==='tri_circumscribed'||S==='tri_incircle'||S==='tri_inscribed_in_circle'){
    const [vA,vB,vC]=ctx.triVerts;
    let isEq=has('equilateral'), isIso=has('isosceles');
    let isRight=has('right');

    // --- Get side lengths ---
    let sBC=segs[vB+vC]||segs[vC+vB];
    let sAC=segs[vA+vC]||segs[vC+vA];
    let sAB=segs[vA+vB]||segs[vB+vA];

    // ===== AUTO-DETECT triangle type from angles =====
    let rightV=null;
    // 1) Any angle = 90 → right triangle, that vertex is rightV
    for(const[lbl,val]of Object.entries(ctx.angles)){
      if(Math.abs(val-90)<0.5 && ctx.triVerts.includes(lbl)){ rightV=lbl; isRight=true; break; }
    }
    // 2) "прямого угла X" / "прямой угол при X" / "прямого угла при вершине X"
    if(!rightV && isRight){
      for(const rx of[
        /прям\w+\s+угл\w*\s+(?:при\s+(?:вершине?\s+)?)?([A-Z])/i,
        /прям\w+\s+угл\w*\s+([A-Z])/i,
        /угол\s+([A-Z])\s+(?:=\s*|рав\w+\s+)90/i,
      ]){
        const rm=ctx.raw.match(rx);
        if(rm && ctx.triVerts.includes(rm[1].toUpperCase())){ rightV=rm[1].toUpperCase(); break; }
      }
    }
    // 3) "прямоугольный треугольник XYZ, угол Y = 90" — Y is rightV
    if(!rightV && isRight){
      for(const[lbl]of Object.entries(ctx.angles)){
        if(ctx.triVerts.includes(lbl)){ rightV=lbl; break; }
      }
    }
    // 4) Default: if right but still no vertex identified → last vertex
    if(isRight && !rightV) rightV=vC;

    // ===== AUTO-DETECT from sides =====
    // Equal sides → isosceles/equilateral
    if(sAB && sAC && sBC){
      if(Math.abs(sAB-sAC)<0.01 && Math.abs(sAC-sBC)<0.01) isEq=true;
      else if(Math.abs(sAB-sAC)<0.01 || Math.abs(sAB-sBC)<0.01 || Math.abs(sAC-sBC)<0.01) isIso=true;
      // Pythagorean check → right triangle
      const sides=[sAB,sAC,sBC].sort((a,b)=>a-b);
      if(!isRight && Math.abs(sides[0]*sides[0]+sides[1]*sides[1]-sides[2]*sides[2])<0.5){
        isRight=true;
        // Find which vertex is opposite the hypotenuse
        if(Math.abs(sides[2]-sBC)<0.01) rightV=vA; // BC is hypotenuse → right at A
        else if(Math.abs(sides[2]-sAC)<0.01) rightV=vB;
        else rightV=vC;
      }
    }

    // If inscribed in circle, compute from R
    if(S==='tri_inscribed_in_circle'&&R){
      if(isEq){
        const side=R*sqrt(3);
        sBC=sAC=sAB=side;
      } else if(isIso){
        if(!sBC)sBC=R*1.4;
        const half=min(sBC/2,R*.99);
        const yb=-sqrt(max(R*R-half*half,0));
        // Compute AB from coordinates
        sAB=sAC=hypot(half,R-yb);
      }
    }

    // If right triangle with 2 sides, compute 3rd
    if(rightV||isRight){
      if(!rightV)rightV=vC;
      const otherVerts=ctx.triVerts.filter(v=>v!==rightV);
      const hyp=segs[otherVerts[0]+otherVerts[1]]||segs[otherVerts[1]+otherVerts[0]];
      const leg1=segs[rightV+otherVerts[0]]||segs[otherVerts[0]+rightV];
      const leg2=segs[rightV+otherVerts[1]]||segs[otherVerts[1]+rightV];
      if(leg1&&leg2&&!hyp){ segs[otherVerts[0]+otherVerts[1]]=sqrt(leg1*leg1+leg2*leg2); }
      if(leg1&&hyp&&!leg2){ segs[rightV+otherVerts[1]]=sqrt(hyp*hyp-leg1*leg1); }
      if(leg2&&hyp&&!leg1){ segs[rightV+otherVerts[0]]=sqrt(hyp*hyp-leg2*leg2); }
      sBC=segs[vB+vC]||segs[vC+vB]; sAC=segs[vA+vC]||segs[vC+vA]; sAB=segs[vA+vB]||segs[vB+vA];
    }

    // Fill in defaults — SMART: use angles and right angle info
    if(isEq){if(!sBC)sBC=10;sAC=sAB=sBC;}
    else if(isRight&&rightV&&!sBC&&!sAC&&!sAB){
      // No sides given for right triangle → build directly from rightV
      const otherV=ctx.triVerts.filter(v=>v!==rightV);
      let leg1=6,leg2=8;
      for(const v of otherV){
        const a=ctx.angles[v];
        if(a&&a!==90){
          const rad=d2r(a);
          leg1=10*Math.tan(rad)>0.5?10*sin(rad)/cos(rad>PI/4?PI/2-rad:rad):6;
          leg2=10*cos(rad)>0.5?10*cos(rad>PI/4?PI/2-rad:rad):8;
          const sc=8/max(leg1,leg2);leg1*=sc;leg2*=sc;
          break;
        }
      }
      const pR=P(0,0,rightV);
      const pV1=P(leg1,0,otherV[0]);
      const pV2=P(0,leg2,otherV[1]);
      s.lines.push([pV1,pV2],[pV2,pR],[pR,pV1]);
      s.rightAngles.push({v:pR,d1:pV1,d2:pV2});
      addExtra(ctx,s,{[rightV]:pR,[otherV[0]]:pV1,[otherV[1]]:pV2},vA,vB,vC,
        dist(s.points[vA],s.points[vB]),dist(s.points[vB],s.points[vC]),dist(s.points[vA],s.points[vC]));
      if(S==='tri_circumscribed'){
        const cc=circumcenter(s.points[vA],s.points[vB],s.points[vC]);
        const O=P(cc.x,cc.y,'O');
        s.circles.push({center:O,radius:cc.r});
        s.dashed.push([O,s.points[vA]],[O,s.points[vB]],[O,s.points[vC]]);
      }
      for(const seg in segs){const[l1,l2]=seg.split('');
        if(s.points[l1]&&s.points[l2]&&ctx.triVerts.includes(l1)&&ctx.triVerts.includes(l2))
          s.dims.push({p1:s.points[l1],p2:s.points[l2],text:fmtNum(segs[seg])});}
      return s;
    }
    else if(Object.keys(ctx.angles).length>=1&&!sBC&&!sAC&&!sAB){
      // Build from angles (no sides given) — use law of sines
      let angA=ctx.angles[vA],angB=ctx.angles[vB],angC=ctx.angles[vC];
      // Compute missing angles from sum = 180°
      if(angA&&angB&&!angC)angC=180-angA-angB;
      else if(angA&&angC&&!angB)angB=180-angA-angC;
      else if(angB&&angC&&!angA)angA=180-angB-angC;
      else if(angA&&!angB&&!angC){ const rem=180-angA; angB=rem/2; angC=rem/2; }
      else if(angB&&!angA&&!angC){ const rem=180-angB; angA=rem/2; angC=rem/2; }
      else if(angC&&!angA&&!angB){ const rem=180-angC; angA=rem/2; angB=rem/2; }
      else { if(!angA)angA=60;if(!angB)angB=60;angC=180-angA-angB; }
      // Safety clamp
      if(angA<=0)angA=10;if(angB<=0)angB=10;if(angC<=0)angC=10;
      const a=10;
      const b=a*sin(d2r(angB))/sin(d2r(angA));
      const c=a*sin(d2r(angC))/sin(d2r(angA));
      sBC=a; sAC=abs(b); sAB=abs(c);
      if(angA===90){isRight=true;rightV=vA;}
      if(angB===90){isRight=true;rightV=vB;}
      if(angC===90){isRight=true;rightV=vC;}
    }
    // ===== OBTUSE: if marked obtuse but no angles at all → default obtuse shape =====
    else if(has('obtuse')&&!sBC&&!sAC&&!sAB&&Object.keys(ctx.angles).length===0){
      // Find which vertex is obtuse (from text or default to first vertex)
      let obtuseV=vA;
      // Try to find from text: "тупой угол при B" / "тупоугольный ... угол B"
      const om=ctx.raw.match(/(?:тупо[йе]\s+угол\s+(?:при\s+)?|угол\s+)([A-Z])/i);
      if(om&&ctx.triVerts.includes(om[1].toUpperCase())) obtuseV=om[1].toUpperCase();
      // Default obtuse angle = 120°
      ctx.angles[obtuseV]=120;
      const otherV=ctx.triVerts.filter(v=>v!==obtuseV);
      ctx.angles[otherV[0]]=30; ctx.angles[otherV[1]]=30;
      const a=10;
      const angA_=ctx.angles[vA]||60,angB_=ctx.angles[vB]||60,angC_=ctx.angles[vC]||60;
      sBC=a;
      sAC=a*sin(d2r(angB_))/sin(d2r(angA_));
      sAB=a*sin(d2r(angC_))/sin(d2r(angA_));
    }
    if(!sBC)sBC=8;if(!sAC)sAC=7;if(!sAB)sAB=6;

    // Build triangle
    let tri;
    if(S==='tri_inscribed_in_circle'&&R&&isIso){
      // Special layout: center at origin, A on top
      const half=min(sBC/2,R*.99);
      const yb=-sqrt(max(R*R-half*half,0));
      const A=P(0,R,vA), B=P(-half,yb,vB), C=P(half,yb,vC);
      const O=P(0,0,'O');
      s.circles.push({center:O,radius:R});
      s.lines.push([A,B],[B,C],[C,A]);
      s.equalMarks.push([[A,B],[A,C]]);
      // Height AH
      if(has('height')||/высот/.test(ctx.tl)){
        const H=P(0,yb,'H');
        s.dashed.push([A,H]);
        s.rightAngles.push({v:H,d1:A,d2:C});
      }
      if(sBC)s.dims.push({p1:B,p2:C,text:fmtNum(sBC)});
      addExtra(ctx,s,{[vA]:A,[vB]:B,[vC]:C},vA,vB,vC,sAB,sBC,sAC);
      return s;
    }
    if(S==='tri_inscribed_in_circle'&&R&&isEq){
      const O=P(0,0,'O');
      const A=P(0,R,vA),B=P(R*cos(d2r(210)),R*sin(d2r(210)),vB),C=P(R*cos(d2r(330)),R*sin(d2r(330)),vC);
      s.circles.push({center:O,radius:R});
      s.lines.push([A,B],[B,C],[C,A]);
      s.equalMarks.push([[A,B],[B,C],[C,A]]);
      return s;
    }

    tri=triFromSides(sBC,sAC,sAB);
    // Map: B at tri.B, C at tri.C, A at tri.A
    const tA=P(tri.A.x,tri.A.y,vA);
    const tB=P(tri.B.x,tri.B.y,vB);
    const tC=P(tri.C.x,tri.C.y,vC);
    s.lines.push([tA,tB],[tB,tC],[tC,tA]);

    // Right angle mark
    if(rightV&&s.points[rightV]){
      const rv=s.points[rightV];
      const others=ctx.triVerts.filter(v=>v!==rightV);
      if(s.points[others[0]]&&s.points[others[1]])
        s.rightAngles.push({v:rv,d1:s.points[others[0]],d2:s.points[others[1]]});
    }
    // Detect obtuse vertex (any angle > 90° in computed triangle)
    let obtuseV=null;
    {// Compute actual angles from coordinates
      const pts3=[tA,tB,tC],lbl3=[vA,vB,vC];
      for(let i=0;i<3;i++){
        const p=pts3[i],p1=pts3[(i+1)%3],p2=pts3[(i+2)%3];
        const ax=p1.x-p.x,ay=p1.y-p.y,bx=p2.x-p.x,by=p2.y-p.y;
        const cosA=(ax*bx+ay*by)/(hypot(ax,ay)*hypot(bx,by)+eps);
        const ang=r2d(Math.acos(max(-1,min(1,cosA))));
        if(ang>90.5) obtuseV=lbl3[i];
        // If angle was explicitly given, use that for mark
        if(ctx.angles[lbl3[i]]&&ctx.angles[lbl3[i]]>90) obtuseV=lbl3[i];
      }
    }
    // Angle marks for all explicitly given angles
    for(const[lbl,val]of Object.entries(ctx.angles)){
      if(val===90)continue;
      if(!ctx.triVerts.includes(lbl))continue;
      const vp=s.points[lbl];if(!vp)continue;
      const others=ctx.triVerts.filter(v=>v!==lbl);
      const p1=s.points[others[0]],p2=s.points[others[1]];
      if(p1&&p2) s.angleMarks.push({v:vp,d1:p1,d2:p2,label:val+'°'});
    }
    // If obtuse but no explicit angle shown → add obtuse arc mark without label
    if(obtuseV&&!ctx.angles[obtuseV]&&has('obtuse')){
      const vp=s.points[obtuseV],others=ctx.triVerts.filter(v=>v!==obtuseV);
      const p1=s.points[others[0]],p2=s.points[others[1]];
      if(vp&&p1&&p2) s.angleMarks.push({v:vp,d1:p1,d2:p2,label:''});
    }
    if(isEq) s.equalMarks.push([[tA,tB],[tB,tC],[tC,tA]]);
    if(isIso&&!isEq) s.equalMarks.push([[tA,tB],[tA,tC]]);

    // Add extras: heights, medians, bisectors, circumscribed circle, incircle
    addExtra(ctx,s,{[vA]:tA,[vB]:tB,[vC]:tC},vA,vB,vC,sAB,sBC,sAC);

    // Circumscribed circle
    if(S==='tri_circumscribed'){
      const cc=circumcenter(tA,tB,tC);
      const O=P(cc.x,cc.y,'O');
      s.circles.push({center:O,radius:cc.r});
      s.dashed.push([O,tA],[O,tB],[O,tC]);
    }
    // Incircle
    if(S==='tri_incircle'){
      const ic=incenter(tA,tB,tC);
      const I=P(ic.x,ic.y,'I');
      s.circles.push({center:I,radius:ic.r});
      // Tangent point on BC
      const a=dist(tB,tC),b=dist(tA,tC),c=dist(tA,tB),sp=(a+b+c)/2;
      const tBC=sp-b; // distance from B to tangent point on BC
      const D_=P(tB.x+(tC.x-tB.x)*tBC/a, tB.y+(tC.y-tB.y)*tBC/a, 'D');
      s.dashed.push([I,D_]);
      s.rightAngles.push({v:D_,d1:I,d2:tC});
    }
    // Inscribed in circle
    if(S==='tri_inscribed_in_circle'&&R){
      const cc=circumcenter(tA,tB,tC);
      const O=P(cc.x,cc.y,'O');
      s.circles.push({center:O,radius:cc.r});
    }

    // Dimension labels for given sides
    for(const seg in segs){
      const l1=seg[0],l2=seg[1];
      if(s.points[l1]&&s.points[l2]&&ctx.triVerts.includes(l1)&&ctx.triVerts.includes(l2)){
        s.dims.push({p1:s.points[l1],p2:s.points[l2],text:fmtNum(segs[seg])});
      }
    }

    return s;
  }

  // ===================== CIRCLE SCENARIOS =====================
  // ===================== TANGENT ONLY (no secant) =====================
  if(S==='tangent_only'){
    let r=R||5;
    let AB=segs.AB||segs.BA;
    let AO=segs.AO||segs.OA;
    if(!AO&&AB) AO=sqrt(AB*AB+r*r);
    if(!AO) AO=r*2;
    if(!AB) AB=sqrt(max(AO*AO-r*r,0));
    const O=P(0,0,'O'), A=P(AO,0,'A');
    const bx=r*r/AO, by=r*sqrt(max(AO*AO-r*r,0))/AO;
    const B=P(bx,by,'B');
    s.circles.push({center:O,radius:r});
    s.lines.push([A,B]); // tangent line from A to B
    s.dashed.push([O,B]); // radius to tangent point
    s.rightAngles.push({v:B,d1:O,d2:A}); // OB ⊥ AB
    if(segs.AB||segs.BA)s.dims.push({p1:A,p2:B,text:fmtNum(segs.AB||segs.BA)});
    if(segs.AO||segs.OA)s.dims.push({p1:A,p2:O,text:fmtNum(segs.AO||segs.OA)});
    return s;
  }

  if(S==='tangent_secant'){
    let AB=segs.AB||segs.BA, AO=segs.AO||segs.OA;
    let r=R;
    if(!r&&AB&&AO)r=sqrt(AO*AO-AB*AB);
    if(!r)r=5;
    if(!AO&&AB)AO=sqrt(AB*AB+r*r);
    if(!AO)AO=r*2.6;
    if(!AB)AB=sqrt(max(AO*AO-r*r,0));

    const O=P(0,0,'O'),A=P(AO,0,'A');
    const bx=r*r/AO,by=r*sqrt(max(AO*AO-r*r,0))/AO;
    const B=P(bx,by,'B');
    s.circles.push({center:O,radius:r});
    s.lines.push([A,B]);
    // secant through O
    const secEnd=P(-r*1.15,0,'');
    s.lines.push([A,secEnd]);
    s.dashed.push([O,B]);
    s.rightAngles.push({v:B,d1:O,d2:A});
    if(segs.AB||segs.BA)s.dims.push({p1:A,p2:B,text:fmtNum(segs.AB||segs.BA)});
    if(segs.AO||segs.OA)s.dims.push({p1:A,p2:O,text:fmtNum(segs.AO||segs.OA)});
    return s;
  }

  if(S==='two_tangents'){
    const r=R||5;
    let d=ctx.distVal;
    const ABseg=segs.AB||segs.BA||segs.AC||segs.CA;
    if(!d&&ABseg) d=sqrt(ABseg*ABseg+r*r);
    if(!d) d=r*2.6;
    // Correct tangent point formula: OB perp AB, so bx=r²/d, by=r*sqrt(d²-r²)/d
    const tangLen=sqrt(max(d*d-r*r,0));
    const O=P(0,0,'O'),A=P(d,0,'A');
    const bx=r*r/d, by=r*tangLen/d;
    const B=P(bx,by,'B'),C=P(bx,-by,'C');
    s.circles.push({center:O,radius:r});
    s.lines.push([A,B],[A,C]);
    s.dashed.push([O,B],[O,C],[O,A]);
    s.rightAngles.push({v:B,d1:O,d2:A},{v:C,d1:O,d2:A});
    s.equalMarks.push([[A,B],[A,C]]);
    if(ctx.distVal||segs.AO||segs.OA) s.dims.push({p1:A,p2:O,text:fmtNum(d)});
    if(R||ctx.radiusVal) s.dims.push({p1:O,p2:B,text:fmtNum(r)});
    if(ABseg) s.dims.push({p1:A,p2:B,text:fmtNum(ABseg)});
    return s;
  }

  if(S==='chord_perp_radius'){
    const r=R||5;
    const BD=segs.BD||segs.DB||1;
    const OD=r-BD;
    const hc=sqrt(max(r*r-OD*OD,0));
    const O=P(0,0,'O'),B=P(r,0,'B'),Dp=P(OD,0,'D');
    const Ap=P(OD,hc,'A'),Cp=P(OD,-hc,'C');
    s.circles.push({center:O,radius:r});
    s.lines.push([O,B],[Ap,Cp]);
    s.rightAngles.push({v:Dp,d1:B,d2:Ap});
    s.dims.push({p1:B,p2:Dp,text:fmtNum(BD)});
    s.equalMarks.push([[Dp,Ap],[Dp,Cp]]);
    return s;
  }

  if(S==='chord_distance'){
    const r=R||10;
    let chLen=null,chSeg=null;
    for(const seg in segs){chLen=segs[seg];chSeg=seg;break;}
    if(!chLen)chLen=r*1.6;
    const hc=chLen/2,d=sqrt(max(r*r-hc*hc,0));
    const O=P(0,0,'O');
    const Ap=P(-hc,-d,chSeg?chSeg[0]:'A'),Bp=P(hc,-d,chSeg?chSeg[1]:'B'),H=P(0,-d,'H');
    s.circles.push({center:O,radius:r});
    s.lines.push([Ap,Bp]);
    s.dashed.push([O,H]);
    s.rightAngles.push({v:H,d1:O,d2:Bp});
    s.dims.push({p1:Ap,p2:Bp,text:fmtNum(chLen)});
    return s;
  }

  // ===================== CENTRAL ANGLE =====================
  if(S==='central_angle'){
    const r=R||6;
    // Extract letters from angle key: "central_AOB" → center=A[1], endpoints=A[0],A[2]
    let centralDeg=null, lA='A', lO='O', lB='B';
    for(const[k,v]of Object.entries(ctx.angles)){
      if(k.startsWith('central_')){centralDeg=v;const lbl=k.slice(8);if(lbl.length===3){lA=lbl[0];lO=lbl[1];lB=lbl[2];}break;}
    }
    if(centralDeg===null){
      for(const[k,v]of Object.entries(ctx.angles)){
        if(k.length===3&&(k[1]==='O'||/[A-Z]/.test(k[1]))){centralDeg=v;lA=k[0];lO=k[1];lB=k[2];break;}
      }
    }
    if(centralDeg===null){
      for(const[k,v]of Object.entries(ctx.angles)){
        if(k.length===3){centralDeg=v;lA=k[0];lO=k[1];lB=k[2];break;}
      }
    }
    if(centralDeg===null) centralDeg=90;
    const O=P(0,0,lO);
    const halfC=d2r(centralDeg/2);
    const baseAngle=d2r(90);
    const Ap=P(r*cos(baseAngle+halfC),r*sin(baseAngle+halfC),lA);
    const Bp=P(r*cos(baseAngle-halfC),r*sin(baseAngle-halfC),lB);
    s.circles.push({center:O,radius:r});
    s.lines.push([O,Ap],[O,Bp]);
    s.highlightArcs=s.highlightArcs||[];
    s.highlightArcs.push({center:O,radius:r,p1:Ap,p2:Bp,minor:true});
    s.angleMarks.push({v:O,d1:Ap,d2:Bp,label:centralDeg+'°'});
    s.equalMarks.push([[O,Ap],[O,Bp]]);
    return s;
  }

  // ===================== INSCRIBED ANGLE (general) =====================
  if(S==='inscribed_angle'){
    const r=R||6;
    const O=P(0,0,'O');
    // 1. Буквы из ключа вписанного угла: "inscribed_ACB" → хорда A-B, вершина C
    let insDeg=null, lA='A', lC='C', lB='B';
    for(const[k,v]of Object.entries(ctx.angles)){
      if(k.startsWith('inscribed_')){
        insDeg=v;
        const lbl=k.slice(10);
        if(lbl.length===3){lA=lbl[0];lC=lbl[1];lB=lbl[2];}
        break;
      }
    }
    // 2. Буквы из ctx.chordSeg если не получены из угла
    if(ctx.chordSeg&&lA==='A'&&lB==='B'){
      lA=ctx.chordSeg[0]; lB=ctx.chordSeg[1];
      const maxCode=Math.max(lA.charCodeAt(0),lB.charCodeAt(0));
      let next=String.fromCharCode(maxCode+1);
      if(next==='O')next=String.fromCharCode(maxCode+2);
      lC=next;
    }
    // 3. Если задан просто угол без имени
    if(!insDeg){
      for(const[k,v]of Object.entries(ctx.angles)){
        if(k.length===3&&k[1]!=='O'){insDeg=v;lA=k[0];lC=k[1];lB=k[2];break;}
      }
    }
    // 4. Хорда = радиус => вписанный угол = 30 градусов
    const chordEqualsR=/хорд[а-яёa-z0-9]*[^.]*?равн[а-яёa-z0-9]*\s+радиус|равн[а-яёa-z0-9]*\s+радиус[а-яёa-z0-9]*\s+окружност/i.test(ctx.raw);
    if(chordEqualsR) insDeg=30;
    if(!insDeg) insDeg=35;
    const centralDeg=insDeg*2;
    const halfC=d2r(centralDeg/2);
    const baseAngle=d2r(250);
    const Ap=P(r*cos(baseAngle+halfC),r*sin(baseAngle+halfC),lA);
    const Bp=P(r*cos(baseAngle-halfC),r*sin(baseAngle-halfC),lB);
    const Cp=P(r*cos(d2r(90)),r*sin(d2r(90)),lC);
    s.circles.push({center:O,radius:r});
    s.lines.push([Ap,Bp]);           // хорда
    s.lines.push([Cp,Ap],[Cp,Bp]);   // стороны вписанного угла
    if(ctx.features.includes('central_angle')){
      s.dashed.push([O,Ap],[O,Bp]);
      s.angleMarks.push({v:O,d1:Ap,d2:Bp,label:centralDeg+'°'});
    }
    s.arcMarks.push({vertex:Cp,p1:Ap,p2:Bp,label:insDeg+'°'});
    s.highlightArcs=s.highlightArcs||[];
    s.highlightArcs.push({center:O,radius:r,p1:Ap,p2:Bp,minor:true});
    if(chordEqualsR){
      s.equalMarks.push([[O,Ap],[O,Bp],[Ap,Bp]]);
      s.dashed.push([O,Ap],[O,Bp]);
    }
    return s;
  }

  // ===================== CENTRAL + INSCRIBED on same arc =====================
  if(S==='central_and_inscribed'){
    const r=R||5;
    // 1. Извлекаем буквы и значения из ключей
    let centralDeg=null, insDeg=null;
    let lA='A', lO='O', lB='B', lC='C';
    for(const[k,v]of Object.entries(ctx.angles)){
      if(k.startsWith('central_')){
        centralDeg=v;
        const lbl=k.slice(8);
        if(lbl.length===3){lA=lbl[0];lO=lbl[1];lB=lbl[2];}
      }
      if(k.startsWith('inscribed_')){
        insDeg=v;
        const lbl=k.slice(10);
        if(lbl.length===3)lC=lbl[1];
      }
    }
    // Если одного значения нет — вычисляем из другого (теорема: вписанный = центральный/2)
    if(centralDeg===null&&insDeg!==null) centralDeg=insDeg*2;
    if(insDeg===null&&centralDeg!==null) insDeg=centralDeg/2;
    if(centralDeg===null){centralDeg=80;insDeg=40;}
    // 2. Позиционируем точки по центральному углу
    const halfC=d2r(centralDeg/2);
    const baseAngle=d2r(270);
    const O=P(0,0,lO);
    const Ap=P(r*cos(baseAngle+halfC),r*sin(baseAngle+halfC),lA);
    const Bp=P(r*cos(baseAngle-halfC),r*sin(baseAngle-halfC),lB);
    const Cp=P(r*cos(d2r(90+15)),r*sin(d2r(90+15)),lC);
    s.circles.push({center:O,radius:r});
    s.lines.push([O,Ap],[O,Bp]);
    s.lines.push([Cp,Ap],[Cp,Bp]);
    s.dashed.push([O,Cp]);
    s.angleMarks.push({v:O,d1:Ap,d2:Bp,label:centralDeg+'°'});
    s.arcMarks.push({vertex:Cp,p1:Ap,p2:Bp,label:insDeg+'°'});
    s.highlightArcs=s.highlightArcs||[];
    s.highlightArcs.push({center:O,radius:r,p1:Ap,p2:Bp,minor:true});
    s.equalMarks.push([[O,Ap],[O,Bp]]);
    return s;
  }

  // ===================== INSCRIBED ANGLE ON DIAMETER = 90° =====================
  if(S==='inscribed_angle_diameter'||S==='diameter_angle'){
    const r=R||7;
    const O=P(0,0,'O');
    const dSeg=ctx.diameterSeg||'AB';
    const Ap=P(-r,0,dSeg[0]);
    const Bp=P(r,0,dSeg[1]);
    // C on circle — inscribed angle on diameter = 90° (Thales' theorem)
    const cAngle=d2r(65); // position on circle
    const Cp=P(r*cos(cAngle),r*sin(cAngle),'C');
    s.circles.push({center:O,radius:r});
    s.lines.push([Ap,Bp]); // diameter
    s.lines.push([Cp,Ap],[Cp,Bp]); // inscribed angle
    s.dashed.push([O,Cp]); // radius to C
    s.rightAngles.push({v:Cp,d1:Ap,d2:Bp}); // 90° at C (Thales)
    // Label "90°"
    s.arcMarks.push({vertex:Cp,p1:Ap,p2:Bp,label:'90°'});
    return s;
  }

  // ===================== INSCRIBED ANGLE + TANGENT =====================
  if(S==='inscribed_angle_tangent'){
    const r=R||5;
    const O=P(0,0,'O');
    let insDeg=50;
    for(const[k,v]of Object.entries(ctx.angles)){
      if(k.startsWith('inscribed_')){insDeg=v;break;}
      if(k.length===3){insDeg=v;break;}
    }
    // B is the tangent point (on circle), tangent line at B
    const Bp=P(r,0,'B');
    // A and C on circle, inscribed angle ABC = insDeg
    // The arc AC (not containing B) = 2*insDeg (inscribed angle theorem)
    const arcAC=d2r(insDeg*2);
    // Place A and C symmetrically relative to B's position
    const bAngle=0; // B is at angle 0
    const Ap=P(r*cos(bAngle+d2r(insDeg*2+30)),r*sin(bAngle+d2r(insDeg*2+30)),'A');
    const Cp=P(r*cos(bAngle+d2r(30)),r*sin(bAngle+d2r(30)),'C');
    
    s.circles.push({center:O,radius:r});
    s.lines.push([Bp,Ap],[Bp,Cp]); // sides of inscribed angle
    s.lines.push([Ap,Cp]); // chord AC
    // Tangent at B (perpendicular to OB)
    const tangLen=r*1.3;
    const T1=P(r,tangLen,''), T2=P(r,-tangLen,'');
    s.lines.push([T1,T2]); // tangent line
    s.dashed.push([O,Bp]); // radius to tangent point
    s.rightAngles.push({v:Bp,d1:O,d2:T1}); // tangent ⊥ radius
    s.arcMarks.push({vertex:Bp,p1:Ap,p2:Cp,label:insDeg+'°'});
    return s;
  }

  // ===================== MULTIPLE INSCRIBED ANGLES ON SAME ARC =====================
  if(S==='two_inscribed_angles'){
    const r=R||6;
    const O=P(0,0,'O');
    // Значение угла
    let insDeg=40;
    for(const[k,v]of Object.entries(ctx.angles)){
      if(k.startsWith('inscribed_')){insDeg=v;break;}
      if(k.length===3&&k[1]!=='O'){insDeg=v;break;}
    }
    // Количество вписанных углов
    const count=ctx.inscribedCount||2;
    // Хорда: буквы из ctx.chordSeg, или из twoInscribedAngles, или дефолт A,B
    let lA='A', lB='B';
    if(ctx.chordSeg){lA=ctx.chordSeg[0];lB=ctx.chordSeg[1];}
    else if(ctx.twoInscribedAngles&&ctx.twoInscribedAngles.length>=1){
      lA=ctx.twoInscribedAngles[0][0];lB=ctx.twoInscribedAngles[0][2]||'B';
    }
    // Буквы вершин — из условия или генерируем последовательно
    let vertLabels=ctx.inscribedVerts||[];
    if(!vertLabels.length&&ctx.twoInscribedAngles){
      vertLabels=ctx.twoInscribedAngles.map(s=>s[1]);
    }
    // Если не хватает — генерируем буквы, не совпадающие с хордой и O
    const forbidden=new Set([lA,lB,'O']);
    const alphabet='CDEFGHIJKLMNPQRSTUVWXYZ';
    let ai=0;
    while(vertLabels.length<count){
      const ch=alphabet[ai++];
      if(!forbidden.has(ch))vertLabels.push(ch);
    }
    vertLabels=vertLabels.slice(0,count);
    // Позиционирование
    const centralDeg=insDeg*2;
    const halfC=d2r(centralDeg/2);
    const baseAngle=d2r(270);
    const Ap=P(r*cos(baseAngle+halfC),r*sin(baseAngle+halfC),lA);
    const Bp=P(r*cos(baseAngle-halfC),r*sin(baseAngle-halfC),lB);
    // Вершины равномерно по большой дуге (от 80° до 200° — больший охват при большом числе)
    const arcSpan=count<=3?d2r(100):count<=6?d2r(150):d2r(190);
    const majorStart=d2r(90)-arcSpan/2, majorEnd=d2r(90)+arcSpan/2;
    const step=count>1?(majorEnd-majorStart)/(count-1):0;
    const vertices=vertLabels.map((lbl,i)=>{
      const ang=count===1?d2r(130):majorStart+i*step;
      return P(r*cos(ang),r*sin(ang),lbl);
    });
    s.circles.push({center:O,radius:r});
    s.lines.push([Ap,Bp]); // хорда
    // Метки угла показываем только если их немного (иначе чертёж нечитаем)
    const showLabel=count<=5;
    vertices.forEach(v=>{
      s.lines.push([v,Ap],[v,Bp]);
      s.arcMarks.push({vertex:v,p1:Ap,p2:Bp,label:showLabel?insDeg+'°':''});
    });
    s.highlightArcs=s.highlightArcs||[];
    s.highlightArcs.push({center:O,radius:r,p1:Ap,p2:Bp,minor:true});
    // Если есть центральный угол — дорисовываем его поверх
    if(ctx.features.includes('central_angle')){
      let centralDeg=null, lO2='O';
      for(const[k,v]of Object.entries(ctx.angles)){
        if(k.startsWith('central_')){centralDeg=v;const lb=k.slice(8);if(lb.length===3)lO2=lb[1];break;}
      }
      if(centralDeg===null) centralDeg=insDeg*2;
      const Oc=P(0,0,lO2);
      s.lines.push([Oc,Ap],[Oc,Bp]);
      s.angleMarks.push({v:Oc,d1:Ap,d2:Bp,label:centralDeg+'°'});
      s.equalMarks.push([[Oc,Ap],[Oc,Bp]]);
    }
    return s;
  }

  // ===================== CIRCLE ON SIDE OF TRIANGLE, TANGENT =====================
  // "Окружность с центром на стороне AC △ABC проходит через C и касается AB в B"
  // Center O on AC, OC=R (passes through C), OB=R and OB⊥AB (tangent at B)
  // → right △AOB: AO² = AB² + OB² → AO = √(AB²+R²), AC = AO + OC
  if(S==='circle_on_side_tangent'){
    const r=R||4;
    const segs_=ctx.segments;
    const cosLine=ctx.centerOnSide||'AC'; // the side center lies on
    const passV=ctx.passesThroughVertex; // vertex circle passes through (e.g. C)
    const tangLine=ctx.tangentToLine||'AB'; // line circle is tangent to
    const tangPt=ctx.tangentAtPoint||tangLine[1]; // point of tangency (e.g. B)
    
    // Get known lengths
    let AB_len=segs_[tangLine]||segs_[tangLine[1]+tangLine[0]];
    if(!AB_len){
      // Try all segment combos
      for(const seg in segs_){
        const s1=seg[0],s2=seg[1];
        if((s1===tangLine[0]&&s2===tangLine[1])||(s1===tangLine[1]&&s2===tangLine[0])){
          AB_len=segs_[seg]; break;
        }
      }
    }
    if(!AB_len) AB_len=3;

    // Compute: AO = √(AB²+R²), AC = AO + R (center between A and passV)
    const AO=sqrt(AB_len*AB_len+r*r);
    const AC_len=AO+r;

    // Build geometry: A at origin, B along some direction, C along another
    // Place A at origin. We need △ABC with the circle.
    // Key triangle: right △AOB with right angle at B
    // O is on line AC, at distance AO from A
    // B is at distance AB from A, and OB⊥AB

    // Place A at origin, AC along positive x-axis
    const pA=P(0,0,'A');
    const pC=P(AC_len,0,'C');
    const pO=P(AO,0,'O'); // center on AC

    // B: AB⊥OB, |AB|=AB_len, |OB|=R
    // B is NOT on line AC. OB⊥AB means angle ABO=90°
    // Actually: tangent at B means OB⊥AB (the LINE AB, not just segment)
    // So from O, drop perpendicular of length R to line AB → that foot is B
    // Distance from A to B along line AB = AB_len
    // Triangle AOB: right angle at B, AO=hyp, AB=leg, OB=leg
    // B is at (0, AB_len)? No — let me think in coordinates.
    // A=(0,0), O=(AO,0). B such that |AB|=AB_len and OB⊥AB.
    // Direction AB: let angle = θ from positive x.
    // B = (AB_len·cosθ, AB_len·sinθ)
    // OB = B - O = (AB_len·cosθ - AO, AB_len·sinθ)
    // AB direction = (cosθ, sinθ)
    // OB · AB = 0: (AB_len·cosθ - AO)·cosθ + AB_len·sin²θ = 0
    // AB_len·cos²θ - AO·cosθ + AB_len·sin²θ = 0
    // AB_len - AO·cosθ = 0
    // cosθ = AB_len / AO
    const cosTheta=AB_len/AO;
    const sinTheta=sqrt(max(1-cosTheta*cosTheta,0));
    const bx=AB_len*cosTheta, by=AB_len*sinTheta;
    const pB=P(bx,by,'B');

    s.circles.push({center:pO,radius:r});
    s.lines.push([pA,pB],[pB,pC],[pC,pA]); // triangle
    s.dashed.push([pO,pB]); // radius to tangent point
    s.rightAngles.push({v:pB,d1:pA,d2:pO}); // OB⊥AB

    // Dimension labels
    if(segs_[tangLine]||segs_[tangLine[1]+tangLine[0]])
      s.dims.push({p1:pA,p2:pB,text:fmtNum(AB_len)});
    // Show diameter or radius
    s.dims.push({p1:pO,p2:pC,text:'R='+fmtNum(r)});

    // Equal marks: OB = OC = R
    s.equalMarks.push([[pO,pB],[pO,pC]]);

    return s;
  }

  // ===================== TANGENT LINE + ARC ANGLE =====================
  // CA tangent at A, O center, arc AD = 130° → angle ACO = (arc-180°+90°) etc.
  if(S==='tangent_angle_arc'){
    const r=R||6;
    const O=P(0,0,'O');
    const arcDeg=ctx.arcDeg?ctx.arcDeg.value:130;
    // A on circle, CA tangent → OA⊥CA. Arc AD = arcDeg.
    // Place A at angle 0 on circle
    const Ap=P(r,0,'A');
    // D at angle arcDeg from A (going counterclockwise)
    const Dp=P(r*cos(d2r(arcDeg)),r*sin(d2r(arcDeg)),'D');
    // C is external, on tangent at A (tangent = vertical line x=r)
    // Angle ACO: A on circle, C external, O center
    // OA⊥tangent, so C is along tangent direction from A
    const anglACO=(arcDeg-90)/2; // by tangent-chord angle theorem
    const cDist=r*2;
    // C below A on tangent (perpendicular to OA)
    const Cp=P(r, -cDist, 'C');
    s.circles.push({center:O,radius:r});
    s.lines.push([Cp,Ap],[Cp,O]); // sides of angle ACO
    s.dashed.push([O,Ap],[O,Dp]); // radii
    s.lines.push([Ap,Dp]); // chord AD
    // tangent line through A
    const tExt=P(r,r*1.2,'');
    s.dashed.push([Cp,tExt]);
    s.rightAngles.push({v:Ap,d1:O,d2:Cp});
    s.arcMarks.push({vertex:Cp,p1:Ap,p2:O,label:''});
    s.highlightArcs=s.highlightArcs||[];
    s.highlightArcs.push({center:O,radius:r,p1:Ap,p2:Dp,minor:arcDeg<=180});
    s.dims.push({p1:Ap,p2:Dp,text:'⌢'+arcDeg+'°'});
    return s;
  }

  // ===================== RIGHT △ + CIRCLE ON HEIGHT =====================
  // Right △ABC, B=90°, BH altitude. Circle with diameter BH intersects AB at P, CB at K.
  if(S==='right_tri_height_circle'){
    const BH_len=ctx.segments.BH||ctx.segments.HB||12;
    // Construct right triangle with B at top
    // Use default proportions: angle A≈37°, so BC/AC≈0.6/0.8
    const AC=BH_len*2.5; // reasonable size
    const AB_=AC*0.8, BC_=AC*0.6;
    const pA=P(0,0,'A'), pC=P(AC,0,'C');
    // B above AC
    const bx=AB_*AB_/AC, by=AB_*BC_/AC;
    const pB=P(bx,by,'B');
    // H = foot of perpendicular from B to AC
    const pH=P(bx,0,'H');
    // Circle with diameter BH: center = midpoint of BH, radius = BH/2
    const oX=(bx+bx)/2, oY=by/2;
    const pO=P(bx,by/2,'O');
    const circR=by/2;
    // P on AB: circle intersects AB. Since angle BPH = 90° (angle in semicircle)
    // P = foot of perp from H to AB
    const fpAB=footPerp({x:bx,y:0},pA,pB);
    const pP=P(fpAB.x,fpAB.y,'P');
    // K on CB: angle BKH = 90° → K = foot of perp from H to CB
    const fpCB=footPerp({x:bx,y:0},pC,pB);
    const pK=P(fpCB.x,fpCB.y,'K');
    
    s.lines.push([pA,pB],[pB,pC],[pC,pA]); // triangle
    s.dashed.push([pB,pH]); // height BH
    s.circles.push({center:pO,radius:circR});
    s.lines.push([pP,pK]); // PK
    s.rightAngles.push({v:pB,d1:pA,d2:pC});
    s.rightAngles.push({v:pH,d1:pB,d2:pC});
    s.dims.push({p1:pB,p2:pH,text:fmtNum(BH_len)});
    return s;
  }

  if(S==='circle_only'){
    const r=R||5;
    P(0,0,'O');
    s.circles.push({center:s.points.O,radius:r});
    return s;
  }

  // ===================== LINES / SEGMENTS / RAYS =====================
  if(S==='lines_only'){
    const objs=ctx.lineObjects||[];
    const halfW=16;
    const betweenAngle=ctx.lineAngle||null;
    const lineFrom=ctx.lineFrom||null;

    // ── CASE: two parallel lines (e.g. "LK параллельна BA") ───────────────
    if(ctx.parallelPair){
      const [l1,l2]=ctx.parallelPair;
      const ensureObj=(lbl)=>objs.find(o=>o.label===lbl)||{kind:'line',label:lbl};
      const obj1=ensureObj(l1), obj2=ensureObj(l2);
      const gap=9;
      const lineEndpointsP={};
      [[obj1,-gap/2],[obj2,gap/2]].forEach(([obj,yOff],i)=>{
        const lA=obj.label[0]||String.fromCharCode(65+i*2);
        const lB=obj.label[1]||String.fromCharCode(66+i*2);
        const A=P(-halfW,yOff,lA), B=P(halfW,yOff,lB);
        s.lines.push([A,B]);
        s.fullLines=s.fullLines||[]; s.fullLines.push({p1:A,p2:B});
        lineEndpointsP[obj.label]={A,B};
      });
      // Parallel tick marks
      const pA=s.lines[0][0], pB=s.lines[0][1];
      const pC=s.lines[1][0], pD=s.lines[1][1];
      s.equalMarks.push([[pA,pB],[pC,pD]]);

      // ── Draw transversal line(s) cutting the parallel lines ───────────────
      // Collect transversal objects: those NOT in the parallel pair
      const transversals = objs.filter(o => o.label !== l1 && o.label !== l2);

      // Also check ctx.intersectPair — the transversal may be named there
      if(!transversals.length && ctx.intersectPair){
        const [ip1,ip2]=ctx.intersectPair;
        const trLabel=[ip1,ip2].find(l=>l!==l1&&l!==l2);
        if(trLabel && !objs.find(o=>o.label===trLabel))
          transversals.push({kind:'line', label:trLabel});
      }

      // Raw angle from text — use as-is (user's angle, e.g. 98°)
      const rawAngle = betweenAngle || ctx.lineAngle || 60;
      // Use the raw angle directly for drawing (don't convert to acute)
      // If > 90, the transversal leans the other way
      const drawAngle = rawAngle <= 90 ? rawAngle : 180 - rawAngle;
      const leansLeft = rawAngle > 90; // if obtuse, transversal leans left

      const y1 = s.lines[0][0].y;  // y of first parallel
      const y2 = s.lines[1][0].y;  // y of second parallel
      const transGap = Math.abs(y2 - y1);

      transversals.forEach((tr, ti) => {
        const lbl = tr.label || '';
        const rad = d2r(drawAngle);
        const tdx = (leansLeft ? -1 : 1) * Math.cos(rad);
        const tdy = -Math.sin(rad); // negative = upward in screen coords

        // Intersection with first parallel (upper line, smaller y)
        const ix1 = -1 + ti * 3;
        const iy1 = y1;
        // Intersection with second parallel: move along transversal until y=y2
        const tParam = (y2 - iy1) / tdy;
        const ix2 = ix1 + tdx * tParam;
        const iy2 = y2;

        // Extend beyond each parallel by the full inter-parallel gap (so transversal looks long enough)
        const extSteps = transGap * 1.1; // how far to extend (in "t" units along transversal)
        // Unit vector along transversal
        const tLen = Math.hypot(tdx, tdy) || 1;
        const ux = tdx / tLen, uy = tdy / tLen;

        // ptA = above upper parallel (extend in -direction from K1)
        const tAx = ix1 - ux * extSteps;
        const tAy = iy1 - uy * extSteps;
        // ptB = below lower parallel (extend in +direction from K2)
        const tBx = ix2 + ux * extSteps;
        const tBy = iy2 + uy * extSteps;

        // Label: first letter of name goes on the upper end (smaller y = top of screen)
        // tAy < tBy always (tAy is the top), so lbl[0] → top, lbl[1] → bottom
        const topLbl  = lbl[0] || '';
        const botLbl  = lbl[1] || '';
        const ptA = P(tAx, tAy, topLbl);
        const ptB = P(tBx, tBy, botLbl);
        s.lines.push([ptA, ptB]);
        s.fullLines = s.fullLines || [];
        s.fullLines.push({p1: ptA, p2: ptB});

        // Intersection points — for angle marks
        const K1 = {x: ix1, y: iy1, label: ''};
        const K2 = {x: ix2, y: iy2, label: ''};

        if(rawAngle === 90){
          s.rightAngles.push({v: K1, d1: s.lines[0][0], d2: ptA});
          s.rightAngles.push({v: K2, d1: s.lines[1][0], d2: ptB});
        } else {
          const suppAngle = 180 - rawAngle;
          // At upper intersection K1: rawAngle between rightward line and downward transversal
          s.angleMarks.push({
            v: K1,
            d1: {x: K1.x + 1,  y: K1.y},
            d2: {x: K1.x + ux, y: K1.y - uy}, // downward = away from ptA
            label: fmtNum(rawAngle) + '°'
          });
          s.angleMarks.push({
            v: K1,
            d1: {x: K1.x - 1,  y: K1.y},
            d2: {x: K1.x + ux, y: K1.y - uy},
            label: fmtNum(suppAngle) + '°'
          });
          // At lower intersection K2
          s.angleMarks.push({
            v: K2,
            d1: {x: K2.x + 1,  y: K2.y},
            d2: {x: K2.x - ux, y: K2.y + uy}, // upward = toward K1
            label: fmtNum(rawAngle) + '°'
          });
          s.angleMarks.push({
            v: K2,
            d1: {x: K2.x - 1,  y: K2.y},
            d2: {x: K2.x - ux, y: K2.y + uy},
            label: fmtNum(suppAngle) + '°'
          });
        }
      });

      // If no explicit transversal found but angle given — draw one with default label
      if(!transversals.length && rawAngle){
        const rad = d2r(drawAngle);
        const tdx = (leansLeft ? -1:1)*Math.cos(rad), tdy=-Math.sin(rad);
        const ix1=0, iy1=y1;
        const tParam=(y2-iy1)/tdy;
        const ix2=ix1+tdx*tParam, iy2_=y2;
        const gap2=Math.abs(y2-y1);
        const ext2=gap2*0.9/Math.sin(rad);
        const ptA=P(ix1-tdx*ext2, iy1-tdy*ext2,'');
        const ptB=P(ix2+tdx*ext2, iy2_+tdy*ext2,'');
        s.lines.push([ptA,ptB]);
        s.fullLines=s.fullLines||[];s.fullLines.push({p1:ptA,p2:ptB});
      }

      // ── Place points on lines ──────────────────────────────────────────────
      const resolvedPoints={};
      // Use different t positions so points on different lines don't look identical
      const tPositions=[0.35, 0.58, 0.42, 0.65];
      let tIdx=0;
      for(const pol of (ctx.pointsOnLine||[])){
        const ep=lineEndpointsP[pol.line]; if(!ep) continue;
        const {A,B}=ep;
        const t=pol.isMid?0.5:tPositions[tIdx++%tPositions.length];
        const px=A.x+(B.x-A.x)*t, py=A.y+(B.y-A.y)*t;
        const pt=P(px,py,pol.point);
        resolvedPoints[pol.point]={x:px,y:py};
        if(pol.isMid) s.equalMarks.push([[A,pt],[pt,B]]);
      }

      // ── Draw lines/segments through points ────────────────────────────────
      for(const lt of (ctx.linesThrough||[])){
        let pts=lt.through.map(lbl=>{
          if(lbl==='__last__'){
            const last=ctx.pointsOnLine&&ctx.pointsOnLine[ctx.pointsOnLine.length-1];
            return last?resolvedPoints[last.point]||s.points[last.point]:null;
          }
          return resolvedPoints[lbl]||s.points[lbl]||null;
        });

        // Resolve unregistered through-points: place them on the relevant parallel line
        pts=pts.map((pt,i)=>{
          if(pt) return pt;
          const lbl=lt.through[i]; if(!lbl||lbl==='__last__') return null;
          // Find which parallel line this point is assigned to via pointsOnLine
          const polEntry=(ctx.pointsOnLine||[]).find(p=>p.point===lbl);
          const targetLine=polEntry?polEntry.line:(ctx.parallelPair?ctx.parallelPair[i%2]:null);
          const ep=targetLine?lineEndpointsP[targetLine]:null;
          if(ep){
            const t=0.38;
            const x=ep.A.x+(ep.B.x-ep.A.x)*t, y=ep.A.y+(ep.B.y-ep.A.y)*t;
            const created=P(x,y,lbl);
            resolvedPoints[lbl]={x,y};
            return created;
          }
          return null;
        }).filter(Boolean);

        if(!pts.length) continue;
        const anchor=pts[0];
        let dx=1,dy=0;
        if(pts.length>=2){
          dx=pts[1].x-pts[0].x; dy=pts[1].y-pts[0].y;
          const len=Math.hypot(dx,dy)||1; dx/=len; dy/=len;
        } else {
          const angDeg=lt.angle!=null?lt.angle:60;
          const ang=d2r(angDeg); dx=cos(ang); dy=-sin(ang);
        }
        const ext=halfW*1.1;
        const lbl2=lt.label||'';
        const lA_lbl=lbl2[0]||'';
        const lB_lbl=lbl2[1]||'';
        if(lt.kind==='segment'){
          const ptA=P(anchor.x-dx*halfW*0.55,anchor.y-dy*halfW*0.55,lA_lbl);
          const ptB=P(anchor.x+dx*halfW*0.55,anchor.y+dy*halfW*0.55,lB_lbl);
          s.lines.push([ptA,ptB]);
        } else {
          const ptA=P(anchor.x-dx*ext,anchor.y-dy*ext,lA_lbl);
          const ptB=P(anchor.x+dx*ext,anchor.y+dy*ext,lB_lbl);
          s.lines.push([ptA,ptB]);
          s.fullLines=s.fullLines||[]; s.fullLines.push({p1:ptA,p2:ptB});
        }
        if(lt.angle!=null&&pts.length<2){s.angleMarks=s.angleMarks||[];const dEnd={x:anchor.x+halfW*0.4,y:anchor.y};const ltEnd={x:anchor.x+dx*halfW*0.4,y:anchor.y+dy*halfW*0.4};s.angleMarks.push({v:{x:anchor.x,y:anchor.y},d1:dEnd,d2:ltEnd,label:lt.angle+'°'});}
      }
      return s;
    }

    // ── CASE: "к прямой DS проведён отрезок GH под углом 60" ──────────────
    // We have a base line and a drawn object starting from a point on the base
    if(lineFrom && objs.length>=2){
      const baseObj=objs.find(o=>o.label===lineFrom.base)||objs[0];
      const drawnObj=objs.find(o=>o.label===lineFrom.drawn)||objs[1];
      const angle=betweenAngle||60; // default 60 if not specified

      // Draw base line (horizontal)
      const bA=P(-halfW, 0, baseObj.label[0]||'A');
      const bB=P( halfW, 0, baseObj.label[1]||'B');
      s.lines.push([bA,bB]);
      if(baseObj.kind==='line'||!baseObj.kind){
        s.fullLines=s.fullLines||[]; s.fullLines.push({p1:bA,p2:bB});
      }

      // Foot of drawn object on base line — place at 1/3 from left
      const footX=-halfW/3, footY=0;

      // Direction of drawn object at given angle from base (horizontal)
      const rad=d2r(angle);
      const len=halfW*0.7;
      const dxD=len*cos(rad), dyD=-len*sin(rad); // negative y = upward in screen coords

      const dA=P(footX, footY, drawnObj.label[0]||'G');   // start on base line
      const dB=P(footX+dxD, footY+dyD, drawnObj.label[1]||'H');
      s.lines.push([dA,dB]);
      if(drawnObj.kind==='segment'){
        const segKey=drawnObj.label;
        if(ctx.segments[segKey])s.dims.push({p1:dA,p2:dB,text:fmtNum(ctx.segments[segKey])});
      }

      // Angle mark at foot
      if(betweenAngle) s.angleMarks.push({v:dA, d1:bB, d2:dB, label:fmtNum(betweenAngle)+'°'});

      // Right angle mark if perpendicular
      if(angle===90) s.rightAngles.push({v:dA,d1:bA,d2:dB});
      return s;
    }

    // ── CASE: two intersecting lines ("DF пересекает HG под углом 60") ──────
    if(ctx.intersectPair || (objs.length>=2 && betweenAngle && !lineFrom)){
      const angle = betweenAngle || 60;
      let obj1, obj2;
      if(ctx.intersectPair){
        const [l1,l2]=ctx.intersectPair;
        obj1=objs.find(o=>o.label===l1)||{kind:'line',label:l1};
        obj2=objs.find(o=>o.label===l2)||{kind:'line',label:l2};
      } else {
        obj1=objs[0]; obj2=objs[1];
      }

      // Centre of intersection at origin
      const ext = halfW * 0.85;
      const rad = d2r(angle);

      // Line 1: horizontal (base)
      const l1A = P(-ext, 0, obj1.label[0]||'A');
      const l1B = P( ext, 0, obj1.label[1]||'B');
      s.lines.push([l1A, l1B]);
      s.fullLines = s.fullLines||[]; s.fullLines.push({p1:l1A, p2:l1B});

      // Line 2: at `angle` from line 1, crossing at origin
      const dx2 = ext*cos(rad), dy2 = -ext*sin(rad);
      const l2A = P(-dx2, dy2, obj2.label[0]||'C');
      const l2B = P( dx2,-dy2, obj2.label[1]||'D');
      s.lines.push([l2A, l2B]);
      s.fullLines.push({p1:l2A, p2:l2B});

      // Intersection point (at origin)
      const iPt = {x:0, y:0, label:''};

      // Angle marks at intersection — show both the given angle and its supplement
      const suppAngle = 180 - angle;
      const showAngle = angle <= 90 ? angle : suppAngle;
      const showSupp  = 180 - showAngle;

      if(angle === 90){
        s.rightAngles.push({v:iPt, d1:l1A, d2:l2B});
      } else {
        // Acute angle mark (between right part of line1 and upper part of line2)
        s.angleMarks.push({
          v: iPt,
          d1: {x: 1, y: 0},          // rightward along line1
          d2: {x: dx2/ext, y:-dy2/ext}, // along line2 upward
          label: fmtNum(showAngle)+'°'
        });
        // Supplementary angle mark (between left part of line1 and upper part of line2)
        s.angleMarks.push({
          v: iPt,
          d1: {x:-1, y: 0},
          d2: {x: dx2/ext, y:-dy2/ext},
          label: fmtNum(showSupp)+'°'
        });
      }
      return s;
    }

    // ── CASE: simple list of independent lines/segments (no angle relation) ──
    const count=max(objs.length,1);
    const spacing=8;
    const fallbackAngles=[0, 20, -15, 30, -25, 10, -10, 35, -30, 5];
    // Map: lineLabel → {A, B} endpoints for placing points-on-line
    const lineEndpoints={};
    objs.forEach((obj,i)=>{
      const yOff=(i-(count-1)/2)*spacing;
      const angleDeg=count===1?0:fallbackAngles[i%fallbackAngles.length];
      const rad=d2r(angleDeg);
      const dx=halfW*cos(rad), dy=halfW*sin(rad);
      const cx=0, cy=yOff;
      const lA=obj.label[0]||String.fromCharCode(65+i*2);
      const lB=obj.label[1]||String.fromCharCode(66+i*2);
      let endA, endB;
      if(obj.kind==='segment'){
        endA=P(cx-dx,cy-dy,lA); endB=P(cx+dx,cy+dy,lB);
        s.lines.push([endA,endB]);
        const segKey=obj.label||lA+lB;
        if(ctx.segments[segKey])s.dims.push({p1:endA,p2:endB,text:fmtNum(ctx.segments[segKey])});
      } else if(obj.kind==='ray'){
        endA=P(cx-dx,cy-dy,lA); endB=P(cx+dx*1.5,cy+dy*1.5,'');
        s.lines.push([endA,endB]);
        s.rays=s.rays||[]; s.rays.push({from:endA,to:endB});
      } else {
        endA=P(cx-dx*1.4,cy-dy*1.4,lA); endB=P(cx+dx*1.4,cy+dy*1.4,lB);
        s.lines.push([endA,endB]);
        s.fullLines=s.fullLines||[]; s.fullLines.push({p1:endA,p2:endB});
      }
      if(obj.label) lineEndpoints[obj.label]={A:endA,B:endB};
    });
    if(!objs.length){
      const A=P(-halfW,0,'A'), B=P(halfW,0,'B');
      s.lines.push([A,B]); s.fullLines=s.fullLines||[]; s.fullLines.push({p1:A,p2:B});
      lineEndpoints['AB']={A,B};
    }

    // ── Place points that lie on lines ─────────────────────────────────────
    const resolvedPointsSimple={};
    const tPosSimple=[0.32, 0.55, 0.42, 0.65, 0.25, 0.70];
    let tIdxSimple=0;
    for(const pol of (ctx.pointsOnLine||[])){
      const ep=lineEndpoints[pol.line];
      if(!ep) continue;
      const {A,B}=ep;
      const t=pol.isMid ? 0.5 : tPosSimple[tIdxSimple++%tPosSimple.length];
      const px=A.x+(B.x-A.x)*t;
      const py=A.y+(B.y-A.y)*t;
      const pt=P(px,py,pol.point);
      resolvedPointsSimple[pol.point]={x:px,y:py};
      if(pol.isMid){
        const midPt=pt;

    }

    // ── Draw lines/segments through points ─────────────────────────────────
    for(const lt of (ctx.linesThrough||[])){
      // First resolve all "through" points
      let pts=lt.through.map(lbl=>{
        if(lbl==='__last__'){
          const last=ctx.pointsOnLine&&ctx.pointsOnLine[ctx.pointsOnLine.length-1];
          return last?resolvedPointsSimple[last.point]||s.points[last.point]:null;
        }
        return resolvedPointsSimple[lbl]||s.points[lbl]||null;
      });

      // If a "through" point is unresolved, place it on the named line (lt.label) at t=0.4
      pts=pts.map((pt,i)=>{
        if(pt) return pt;
        const lbl=lt.through[i]; if(!lbl||lbl==='__last__') return null;
        // Try to find the named line in lineEndpoints
        const ep=lineEndpoints[lt.label];
        if(ep){
          const t=0.4;
          const x=ep.A.x+(ep.B.x-ep.A.x)*t, y=ep.A.y+(ep.B.y-ep.A.y)*t;

        // Fallback: place at canvas centre with a slight offset
        const created=P(-halfW*0.1,0,lbl);

      }).filter(Boolean);

      if(!pts.length) continue;
      const anchor=pts[0];
      let dx=1,dy=0;
      if(pts.length>=2){

        const ptB=P(anchor.x+dx*ext,anchor.y+dy*ext,lB_lbl);
        s.lines.push([ptA,ptB]);

  }

  // ===================== TRIANGLE WITH PARALLEL LINE (Thales / similarity) =====================
  if(S==='tri_parallel_line'){

    // Pattern: "параллельная стороне XY" or "параллельна стороне XY"
    let parallelSide=null; // two-char label e.g. "AC"
    {const m=raw.match(/параллельн[а-яёa-z0-9]*\s+сторон[а-яёa-z0-9]*\s+([A-Z]{2})/i);
     if(m)parallelSide=m[1].toUpperCase();}

     if(m){ptOnSide1=m[1].toUpperCase();ptOnSide2=m[2].toUpperCase();}}

    // Side from apex to baseV1 vs apex to baseV2

    let pLeft=ptOnSide1, pRight=ptOnSide2; // pLeft on apex-baseV1, pRight on apex-baseV2
    {const sideA1=apexV+baseV1, sideA1r=baseV1+apexV;
     const sideA2=apexV+baseV2, sideA2r=baseV2+apexV;

    const segApexBaseR=apexV+baseV2, segApexBaseR2=baseV2+apexV;

    const segApexBaseL=apexV+baseV1, segApexBaseL2=baseV1+apexV;
    let apexBaseLeft=segs_[segApexBaseL]||segs_[segApexBaseL2]||null;

    // ── 4. Compute similarity ratio k ────────────────────────────────────
    let k=null;
    if(MN_len&&baseSideLen)k=MN_len/baseSideLen;
    // If k unknown, try from side segments: k = apexToRight / apexBaseRight
    if(!k&&apexToRight&&apexBaseRight)k=apexToRight/apexBaseRight;

    // ── 5. Build geometry ─────────────────────────────────────────────────
    const baseW=baseSideLen||20;

    // ── 6. Dimension labels ───────────────────────────────────────────────
    if(MN_len) s.dims.push({p1:pPtLeft,p2:pPtRight,text:fmtNum(MN_len)});
    if(baseSideLen) s.dims.push({p1:pBase1,p2:pBase2,text:fmtNum(baseSideLen)});
    if(rightToBase) s.dims.push({p1:pPtRight,p2:pBase2,text:fmtNum(rightToBase)});

  }

  // ===================== PARALLEL SEGMENTS INTERSECTION =====================
  if(S==='parallel_segments'){

    s.dims.push({p1:pA,p2:pB,text:fmtNum(AB_)},{p1:pD,p2:pC,text:fmtNum(DC)},{p1:pA,p2:pC,text:fmtNum(AC_)});

  // ===================== TRIANGLE: PERP TO MEDIAN BISECTS ANGLE =====================
  if(S==='tri_perp_median'){
    const[vA,vB,vC]=ctx.triVerts;
    let ac=segs[vA+vC]||segs[vC+vA]||4;
    const ab=ac,bc=ab*1.2;

    s.dashed.push([tB,pM]);
    const dA_=dist(tA,tB),dC_=dist(tA,tC),t_=dA_/(dA_+dC_);
    const pD=P(tB.x+(tC.x-tB.x)*t_,tB.y+(tC.y-tB.y)*t_,'D');
    s.dashed.push([tA,pD]);
    const I=lineIntersect(tA,pD,tB,pM);
    if(I){s.rightAngles.push({v:P(I.x,I.y,''),d1:tA,d2:tB});}
    s.dims.push({p1:tA,p2:tC,text:fmtNum(ac)});
    s.equalMarks.push([[tA,tB],[tA,tC]]);

  }

  // ===================== QUADRILATERALS (comprehensive) =====================
  
  // Helper: bisector direction at vertex idx of quadrilateral
  function quadBisDir(idx,pts4,labels4){
    const vp=pts4[idx],prev=pts4[(idx+3)%4],next=pts4[(idx+1)%4];
    const a1=atan2(prev.y-vp.y,prev.x-vp.x);
    const a2=atan2(next.y-vp.y,next.x-vp.x);

  if(S==='trapezoid'||S==='trapezoid_perp_diag'){
    const[A,B,C,D]=ctx.quadVerts;
    let ad=segs[A+D]||segs[D+A]||ctx.baseB||null, bc=segs[B+C]||segs[C+B]||ctx.baseA||null;
    let ab=segs[A+B]||segs[B+A], cd=segs[C+D]||segs[D+C];
    let h=ctx.heightVal;
    const isR=has('right'), isIso=has('isosceles');
    const hasDiag=has('diagonal');
    const hasMidline=/средн/i.test(ctx.tl)&&/лини/i.test(ctx.tl);
    const hasHt=ctx.heightSeg||/высот/i.test(ctx.tl);
    const hasMidDiagSeg=/середин[а-яёa-z0-9]*\s+диагонал/i.test(ctx.tl);
    let perim=ctx.perimeter;
    let trapAngles={};
    for(const[lbl,val]of Object.entries(ctx.angles)) trapAngles[lbl]=val;
    let bisSide=null,bisF=null;
    {const bm=ctx.raw.match(/биссектрис[а-яёa-z0-9]*\s+угл[а-яёa-z0-9]*\s+([A-Z])\s+и\s+([A-Z]).*?пересекаются\s+в\s+точке\s+([A-Z])/i);

    if(bisSide&&bisF){

        if(Fp){const pF=P(Fp.x,Fp.y,bisF);s.dashed.push([b1.vp,pF],[b2.vp,pF]);
          if(af)s.dims.push({p1:b1.vp,p2:pF,text:bisSide[0]+'F='+fmtNum(af)});

      }
    }
